<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WellTrack</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<script src="workouts.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="wt-tokens.css">
<link rel="stylesheet" href="mini.css">
<style>
/* Only what the design system does not carry: the running app's scroll
   behaviour, and disclosure widgets the static mockups did not need. */
html, body { margin: 0; padding: 0; background: var(--surface-base); }
body { font-family: var(--font-sans); color: var(--ink); -webkit-tap-highlight-color: transparent; }
.m-screen { width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; }
.m-body { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--space-6)); }
.m-tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
          width: 100%; max-width: 480px; padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
[hidden] { display: none !important; }
/* each view stacks on the same rhythm as the mockups */
main.m-body > section { display: flex; flex-direction: column; gap: var(--space-4); }
main.m-body > section > .m-sub { margin-top: calc(var(--space-4) * -1 + 2px); }
.m-sect { margin: var(--space-2) 0 calc(var(--space-2) * -1); }

details.m-nest-d { margin-top: var(--space-2) }
details.m-nest-d > summary { cursor: pointer; color: var(--accent); display: block;
  padding: 7px 0; min-height: 32px }
details.m-nest-d > summary .unit { display: block; color: var(--ink-muted); margin-top: 1px }
.m-detail { padding: var(--space-3) var(--space-4) var(--space-4);
  border-top: 1px solid var(--border-subtle); background: var(--surface-card) }
.m-detail ul, .m-detail ol { margin: var(--space-2) 0 0; padding-left: 20px }
.m-detail li { margin-bottom: var(--space-1); color: var(--ink) }
.m-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 20px);
  background: var(--ink); color: var(--surface-base); padding: 10px 16px;
  border-radius: var(--radius-pill); z-index: 60; opacity: 0; transition: opacity .18s;
  pointer-events: none; max-width: 85% }
.m-toast.show { opacity: 1 }
.m-sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end }
.m-sheet-wrap .m-sheet { position: relative; max-height: 78vh; overflow-y: auto;
  width: 100%; max-width: 480px; margin: 0 auto }
.m-sheet-wrap .m-scrim { position: fixed }

/* a panel behind a tab — same rhythm as a view */
.m-panel { display: flex; flex-direction: column; gap: var(--space-4) }

/* a segmented control with more entries than fit across 390px */
.m-seg--scroll { overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none }
.m-seg--scroll::-webkit-scrollbar { display: none }
.m-seg--scroll button { flex: 0 0 auto; padding: 0 var(--space-3); white-space: nowrap }
.m-seg button .m-seg__n { margin-left: 5px; opacity: .6 }

/* recipe card header — the whole card used to be the tap target, which meant
   anything tapped inside the open body closed it again */
.m-recipe__head { display: flex; flex-direction: column; gap: var(--space-2); width: 100%;
  padding: 0; border: 0; background: transparent; color: inherit; font-family: inherit;
  text-align: left; cursor: pointer }
.m-recipe__head:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 4px }
.m-recipe__chev { transition: transform .15s; color: var(--ink-muted); flex: none }
.m-recipe__head[aria-expanded="true"] .m-recipe__chev { transform: rotate(180deg) }

/* prep blocks inside the batch cook card */
.m-block { display: block }
.m-block > .title-sm { display: block }
.m-prepbox { background: var(--surface-inset); border-radius: var(--radius-md);
  padding: var(--space-3); margin-bottom: var(--space-3) }
.m-prepbox ul { margin: var(--space-2) 0 0; padding-left: 19px }
.m-prepbox li { margin-bottom: var(--space-1) }
.m-subitem { padding: var(--space-2) 0; border-top: 1px solid var(--border-subtle) }
.m-subitem:first-of-type { border-top: 0 }
.m-jar--todo { border: 1px solid var(--warn) }

/* the cook order leads the session — it is what you follow while standing
   in the kitchen; the recipes below it are the reference */
.m-instr { background: var(--surface-inset); border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4) }
.m-instr .m-steps { margin-top: var(--space-2) }

/* "BREAKFAST" does not fit the design's 58px slot column and was overrunning
   the meal name beside it */
.m-day__slot { width: 78px; white-space: nowrap }

/* an expanded meal sits inside the day card, so it keeps the card's gutter */
.slotdetail { padding: var(--space-3) var(--space-4) var(--space-4);
  border-top: 1px solid var(--border-subtle) }
</style>
</head>
<body>

<div class="m-screen">
<main class="m-body">
  <section id="view-today">
    <div class="m-head"><h1 class="display-md">Today</h1></div>
    <p class="m-sub caption" id="today-sub">—</p>
    <div id="today-macros" class="m-col"></div>
    <h2 class="m-sect label m-up">Today's meals</h2>
    <div id="today-plan" class="m-col"></div>
    <h2 class="m-sect label m-up">Session</h2>
    <div id="today-session"></div>
    <h2 class="m-sect label m-up">Streaks</h2>
    <div class="m-stats" id="today-streaks"></div>
  </section>

  <section id="view-plan" hidden>
    <div class="m-head"><h1 class="display-md">Meal plan</h1></div>
    <p class="m-sub caption" id="plan-sub">What's coming up</p>
    <div class="m-seg" id="plan-tabs" role="tablist">
      <button class="caption-strong" role="tab" data-panel="days" aria-selected="true">The days</button>
      <button class="caption-strong" role="tab" data-panel="prep" aria-selected="false">Meal prep</button>
    </div>

    <div class="m-panel" id="plan-panel-days">
      <div class="m-seg" id="plan-range" role="tablist">
        <button class="caption-strong" role="tab" data-days="7" aria-selected="true">This week</button>
        <button class="caption-strong" role="tab" data-days="14" aria-selected="false">Two weeks</button>
      </div>
      <div id="plan-days" class="m-col"></div>
    </div>

    <div class="m-panel" id="plan-panel-prep" hidden>
      <div class="m-seg m-seg--scroll" id="batch-tabs" role="tablist"></div>
      <div id="batch-sessions" class="m-col"></div>
    </div>
  </section>

  <section id="view-progress" hidden>
    <div class="m-head"><h1 class="display-md">Progress</h1></div>
    <h2 class="m-sect label m-up">Last 7 days</h2>
    <div id="scorecard"></div>
    <h2 class="m-sect label m-up">Against the glide path</h2>
    <p class="m-sub caption" id="progress-sub">—</p>
    <div id="progress-list" class="m-col"></div>
  </section>

  <section id="view-recipes" hidden>
    <div class="m-head"><h1 class="display-md">Recipes</h1></div>
    <label class="m-search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="recipe-search" placeholder="Name, cuisine or tag" autocomplete="off" aria-label="Search recipes" />
    </label>
    <div class="m-seg m-seg--scroll" id="recipe-tabs" role="tablist"></div>
    <p class="m-sub caption" id="recipe-sub" hidden></p>
    <div id="recipe-list" class="m-col"></div>
  </section>

  <section id="view-shopping" hidden>
    <div class="m-head"><h1 class="display-md">Ingredients</h1></div>
    <p class="m-sub caption" id="shopping-sub">For today's meals</p>
    <div class="m-seg" id="shop-range" role="tablist">
      <button class="caption-strong" role="tab" data-days="1" aria-selected="true">Today</button>
      <button class="caption-strong" role="tab" data-days="3" aria-selected="false">3 days</button>
      <button class="caption-strong" role="tab" data-days="7" aria-selected="false">Week</button>
      <button class="caption-strong" role="tab" data-days="14" aria-selected="false">Fortnight</button>
    </div>
    <div id="shopping-list" class="m-col"></div>
  </section>
</main>

<div class="m-sheet-wrap" id="swap-sheet" hidden>
  <div class="m-scrim" data-close></div>
  <div class="m-sheet">
    <i class="m-sheet__grab"></i>
    <h3 class="title-md" id="swap-title">Swap meal</h3>
    <p class="m-sub caption" id="swap-sub">Pick a replacement</p>
    <div id="swap-options" class="m-col"></div>
  </div>
</div>
<div class="m-toast caption" id="toast"></div>

<nav class="m-tabs" role="tablist" aria-label="Sections">
  <button class="m-tab" role="tab" data-view="today" aria-selected="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg><span>Today</span></button>
  <button class="m-tab" role="tab" data-view="plan" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Plan</span></button>
  <button class="m-tab" role="tab" data-view="progress" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 17l6-6 4 4 7-8"/><path d="M21 7h-5M21 7v5"/></svg><span>Progress</span></button>
  <button class="m-tab" role="tab" data-view="recipes" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3v8a3 3 0 006 0V3M9 11v10M15 3c-1.7 1.2-2 3.4-2 5.5 0 1.6.6 2.5 2 2.5v10"/></svg><span>Recipes</span></button>
  <button class="m-tab" role="tab" data-view="shopping" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h7.7a2 2 0 002-1.6L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span>Ingredients</span></button>
</nav>
</div>

<script>
/* ---------------------------------------------------------------------------
 * WellTrack mini app
 *
 * Reads the same Supabase tables the Telegram coach writes and the Flutter app
 * syncs — wt_recipes, wt_meals / wt_meal_items / wt_daily_nutrition_summary,
 * and the coach tracking tables (wt_weigh_ins, wt_energy_scores, ...).
 *
 * It is read-only on purpose: the coach owns writes, using the secret key.
 * Anything this page cannot read (RLS, or a table that does not exist yet)
 * degrades to an explicit message rather than a blank panel.
 * ------------------------------------------------------------------------- */

const CFG = window.WELLTRACK_CONFIG || {};
const TG = window.Telegram?.WebApp;

/* The plan's fixed constants, mirrored from health/6-month-transformation-plan.md */
const PLAN_START = new Date('2026-10-26T00:00:00+01:00');   // Week 1, Monday
const DAYS = [
  { name: 'Sunday',    session: 'Full rest + batch cook', type: 'full rest', kcal: 1800, protein: 160 },
  { name: 'Monday',    session: 'Upper Push',             type: 'training',  kcal: 2200, protein: 180 },
  { name: 'Tuesday',   session: 'Rest + 30 min walk',     type: 'rest',      kcal: 1900, protein: 170 },
  { name: 'Wednesday', session: 'Back & Pull',            type: 'training',  kcal: 2200, protein: 180 },
  { name: 'Thursday',  session: 'Lower Body',             type: 'training',  kcal: 2200, protein: 180 },
  { name: 'Friday',    session: 'Core + Conditioning',    type: 'training',  kcal: 2200, protein: 180 },
  { name: 'Saturday',  session: 'Walk 30–45 min',         type: 'rest',      kcal: 1900, protein: 170 },
];

/* Glide path from the agent spec. month1/3/6 are the milestone targets. */
const GLIDE = [
  { key: 'weight',    label: 'Weight',            unit: 'kg', start: 91.5, m1: 90.5, m3: 88.5, m6: 86,  dir: 'down' },
  { key: 'protein',   label: 'Protein hit rate',  unit: '%',  start: 0,    m1: 70,   m3: 85,   m6: 90,  dir: 'up' },
  { key: 'plank',     label: 'Plank hold',        unit: 's',  start: 0,    m1: 45,   m3: 60,   m6: 90,  dir: 'up' },
  { key: 'circuit',   label: 'Circuit rounds',    unit: '',   start: 1.5,  m1: 3,    m3: 4,    m6: 4.5, dir: 'up' },
  { key: 'energy',    label: 'Energy (1–5 avg)',  unit: '',   start: 0,    m1: 3.0,  m3: 3.5,  m6: 4.0, dir: 'up' },
  { key: 'supps',     label: 'Supplement compliance', unit: '%', start: 0, m1: 80,   m3: 90,   m6: 95,  dir: 'up' },
];

const todayISO = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/London' });
const dayInfo   = () => DAYS[new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/London' })).getDay()];
const planWeek  = () => {
  const w = Math.floor((Date.now() - PLAN_START.getTime()) / 6048e5) + 1;
  return w < 1 ? 0 : w;
};

/* --- data access ---------------------------------------------------------- */

async function sb(path) {
  if (!CFG.url || !CFG.anonKey) throw new Error('config-missing');
  const res = await fetch(`${CFG.url}/rest/v1/${path}`, {
    headers: {
      apikey: CFG.anonKey,
      Authorization: `Bearer ${CFG.token || CFG.anonKey}`,
      Accept: 'application/json',
    },
  });
  if (res.status === 404) throw new Error('table-missing');
  if (!res.ok) throw new Error(`http-${res.status}`);
  return res.json();
}

/** Returns rows, or null when the table is unreadable — callers show why. */
async function tryRows(path) {
  try { return await sb(path); } catch { return null; }
}

/* --- rendering helpers ---------------------------------------------------- */

const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/** A target bar. Protein leads — it is the binding constraint in the plan. */
function macroCard(label, value, target, unit, minor = false) {
  const pct = target ? Math.min(100, Math.round((value / target) * 100)) : 0;
  const short = target && value < target * 0.9;
  const fill = short ? 'var(--warn-fill)' : 'var(--success-fill)';
  return `<div class="m-target${minor ? ' m-target--minor' : ''}">
    <div class="m-target__head">
      <span class="${minor ? 'title-sm' : 'title-md'}">${label}</span>
      <span class="m-grow"></span>
      <span class="${minor ? 'metric-sm' : 'metric'}">${Math.round(value)}</span>
      <span class="unit m-muted">/ ${target}${unit}</span>
    </div>
    <div class="m-track${minor ? ' m-track--thin' : ''}">
      <span style="width:${pct}%;background:${fill}"></span>
    </div>
  </div>`;
}

function statusFor(current, target, dir, points) {
  if (points < 3) return ['none', '⏸️ Insufficient data'];
  const progress = dir === 'down' ? (91.5 - current) / (91.5 - target) : current / target;
  if (progress >= 1) return ['ok', '✅ On track'];
  if (progress >= 0.75) return ['warn', '⚠️ At risk'];
  return ['bad', '🔴 Off track'];
}

function sparkline(values) {
  if (values.length < 2) return '';
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * 100;
    const y = 50 - ((v - min) / span) * 44;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg class="spark" viewBox="0 0 100 56" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="var(--link)" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
  </svg>`;
}



/* --- the day's workout, in full ----------------------------------------- */

function workoutBlock(week) {
  const idx = new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/London' })).getDay();
  const w = (window.WELLTRACK_WORKOUTS || {})[idx];
  const rules = window.WELLTRACK_TRAINING_RULES || [];
  if (!w) return `<div class="m-meal"><strong class="title-md">${esc(dayInfo().session)}</strong></div>`;

  const deload = week && week % 4 === 0;
  const row = (e) => `<tr>
      <td class="body">${esc(e.name)}${e.note ? `<span class="m-ex__note caption">${esc(e.note)}</span>` : ''}</td>
      <td class="caption-strong" style="white-space:nowrap">${esc(e.sets || e.detail || '')}</td>
      <td class="caption m-muted" style="white-space:nowrap">${esc(e.tempo || '')}</td>
      <td class="caption m-muted" style="white-space:nowrap">${esc(e.rest || '')}</td>
    </tr>`;

  return `<div class="m-meal">
    <div class="m-meal__top">
      <div class="m-grow">
        <h3 class="m-meal__name title-md" style="margin:0">${esc(w.name)}</h3>
        <p class="caption m-muted" style="margin:2px 0 0">${esc(w.focus)}</p>
      </div>
      <span class="caption m-muted" style="white-space:nowrap">${esc(w.duration)} · ${esc(w.intensity)}</span>
    </div>

    ${deload ? `<div class="m-deload caption-strong">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="flex:none"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
      <span>Deload week — all weights down 40%, one less set per exercise. Mandatory.</span>
    </div>` : ''}

    ${w.note ? `<p class="caption m-muted" style="margin:0">${esc(w.note)}</p>` : ''}

    ${w.exercises?.length ? `<table class="m-ex">
      <thead><tr>
        <th class="label m-up">Exercise</th><th class="label m-up">Sets</th>
        <th class="label m-up">Tempo</th><th class="label m-up">Rest</th>
      </tr></thead>
      <tbody>${w.exercises.map(row).join('')}</tbody></table>` : ''}

    ${w.circuit ? `<div class="m-circuit">
      <strong class="title-sm">${esc(w.circuit.title)}</strong>
      <p class="caption m-muted" style="margin:0">${esc(w.circuit.note)}</p>
      <table class="m-ex"><tbody>${w.circuit.items.map(row).join('')}</tbody></table>
    </div>` : ''}

    ${w.exercises?.length ? `<details class="m-nest-d">
      <summary class="caption-strong">Training rules</summary>
      <ul class="caption m-muted" style="margin:var(--space-2) 0 0;padding-left:18px">${
        rules.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
    </details>` : ''}
  </div>`;
}

/* --- today's plan ---------------------------------------------------------
 * Preference order:
 *   1. wt_meal_plan_entries rows for today, once the coach writes them
 *   2. a deterministic rotation over the recipe library
 * The rotation is seeded on the date, so the plan is stable all day and moves
 * on tomorrow, and each slot is drawn from the recipes closest to its protein
 * target so four meals add up to the day's number.
 * ------------------------------------------------------------------------ */

const SLOTS = [
  { key: 'breakfast', label: 'Breakfast', protein: 45 },
  { key: 'lunch',     label: 'Lunch',     protein: 45 },
  { key: 'dinner',    label: 'Dinner',    protein: 45 },
  { key: 'snack',     label: 'Snack',     protein: 25 },
];

/** Days since epoch in London — the rotation seed. */
function dayNumber() {
  return Math.floor(new Date(todayISO()).getTime() / 864e5);
}

async function allRecipes() {
  if (!RECIPES.length) {
    const rows = await tryRows('wt_recipes?select=*&order=title');
    RECIPES = rows || [];
  }
  return RECIPES;
}

/** Recipes a slot may draw on. Marinades and bare sides are never a meal. */
function poolFor(slot, recipes) {
  const usable = recipes.filter((r) =>
    r.calories_per_serving != null &&
    !(r.tags || []).includes('marinade') &&
    !(r.tags || []).includes('side'));

  let pool = usable.filter((r) => r.meal_type === slot.key);

  // Lunch and dinner are interchangeable when one of them is thin
  if (pool.length < 3 && (slot.key === 'lunch' || slot.key === 'dinner')) {
    pool = usable.filter((r) => r.meal_type === 'lunch' || r.meal_type === 'dinner');
  }
  if (!pool.length) pool = usable;

  // Closest to this slot's protein target first, then rotate within the best few
  return pool
    .slice()
    .sort((a, b) => Math.abs((a.protein_per_serving || 0) - slot.protein) -
                    Math.abs((b.protein_per_serving || 0) - slot.protein));
}

async function todaysPlan() {
  const recipes = await allRecipes();
  if (!recipes.length) return null;

  // 1. the coach's morning plan wins
  const byId = new Map(recipes.map((r) => [r.id, r]));
  const byTitle = new Map(recipes.map((r) => [r.title.toLowerCase(), r]));

  const coach = await tryRows(
    `wt_coach_daily_plan?select=slot,recipe_id,recipe_title,note,eaten,portion&date=eq.${todayISO()}`);
  if (coach && coach.length) {
    const plan = SLOTS.map((slot) => {
      const row = coach.find((e) => (e.slot || '').toLowerCase() === slot.key);
      if (!row) return { slot, recipe: null, source: 'coach' };
      // recipe_id is authoritative; fall back to the title the coach wrote
      const recipe = (row.recipe_id && byId.get(row.recipe_id)) ||
                     byTitle.get((row.recipe_title || '').toLowerCase()) ||
                     { id: `t-${slot.key}`, title: row.recipe_title, tags: [] };
      return { slot, recipe, source: 'coach', note: row.note,
               eaten: Boolean(row.eaten), portion: Number(row.portion) || 1 };
    });
    if (plan.some((p) => p.recipe)) return plan;
  }

  // 2. the Flutter app's own plan table, if it is ever populated
  const stored = await tryRows(
    `wt_meal_plan_entries?select=slot,recipe_id&date=eq.${todayISO()}`);
  if (stored && stored.length) {
    const plan = SLOTS.map((slot) => {
      const row = stored.find((e) => (e.slot || '').toLowerCase() === slot.key);
      return { slot, recipe: row ? byId.get(row.recipe_id) : null, source: 'planned' };
    });
    if (plan.some((p) => p.recipe)) return plan;
  }

  // 3. deterministic rotation — nothing saved yet today
  const seed = dayNumber();
  const used = new Set();
  return SLOTS.map((slot, i) => {
    const pool = poolFor(slot, recipes);
    const top = pool.slice(0, Math.max(3, Math.min(6, pool.length)));
    let pick = null;
    for (let k = 0; k < top.length; k++) {
      const cand = top[(seed + i * 2 + k) % top.length];
      if (!used.has(cand.id)) { pick = cand; break; }
    }
    pick = pick || top[(seed + i) % Math.max(top.length, 1)] || null;
    if (pick) used.add(pick.id);
    return { slot, recipe: pick, source: 'suggested' };
  });
}

/* --- one recipe renderer, used by Today, Plan and the batch list ---------- */

/** Marinades a recipe names in its ingredients, resolved to full recipes. */
function marinadesOf(recipe) {
  const byTitle = new Map(RECIPES.map((r) => [r.title.toLowerCase(), r]));
  const out = [];
  for (const ing of recipe.ingredients || []) {
    const m = /\(see ([^)]+)\)/i.exec(ing.item || '');
    if (!m) continue;
    const hit = byTitle.get(m[1].trim().toLowerCase());
    if (hit && !out.includes(hit)) out.push(hit);
  }
  return out;
}

const scaleQty = (q, portion) =>
  q == null ? '' : String(Math.round(q * portion * 100) / 100);

function ingredientList(recipe, portion = 1) {
  if (!(recipe.ingredients || []).length) return '';
  return `<strong>Ingredients${portion !== 1 ? ` (×${portion})` : ''}</strong><ul>${
    recipe.ingredients.map((g) => `<li>${esc(
      [scaleQty(g.quantity, portion), g.unit && g.unit !== 'whole' ? g.unit : '', g.item]
        .filter(Boolean).join(' '))}</li>`).join('')}</ul>`;
}

function methodList(recipe) {
  if (!(recipe.instructions || []).length) {
    return '<p class="caption m-muted">No method recorded for this one.</p>';
  }
  return `<strong style="display:block;margin-top:10px">Method</strong><ol>${
    recipe.instructions.map((x) => `<li>${esc(x.instruction || x)}</li>`).join('')}</ol>`;
}

/**
 * Full detail for a recipe: scaled ingredients, method, and any marinade it
 * depends on spelled out inline — those are repeat jobs and it is no use
 * knowing you need jerk marinade without being told how to make it.
 */
function recipeDetail(recipe, portion = 1) {
  const marinades = marinadesOf(recipe);
  return `
    ${ingredientList(recipe, portion)}
    ${methodList(recipe)}
    ${marinades.map((m) => `
      <details class="m-nest-d">
        <summary class="caption-strong">${esc(m.title)} — how to make it</summary>
        ${ingredientList(m, 1)}
        ${methodList(m)}
        <p class="caption m-muted" style="margin:8px 0 0">Makes ${m.servings} tbsp. Keeps in a jar in the fridge,
          so make it once and use it across the week.</p>
      </details>`).join('')}`;
}

/* --- writes ---------------------------------------------------------------
 * The page holds only the anon key, so every write goes to the wt-action edge
 * function with Telegram's signed initData. Outside Telegram there is no
 * initData, so the buttons say so rather than failing silently.
 * ------------------------------------------------------------------------ */

const INIT_DATA = TG?.initData || '';
const CAN_WRITE = Boolean(INIT_DATA);

function toast(msg) {
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

async function act(payload) {
  if (!CAN_WRITE) {
    toast('Open this from the Telegram bot to make changes');
    return null;
  }
  try {
    const res = await fetch(`${CFG.url}/functions/v1/wt-action`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ...payload, initData: INIT_DATA }),
    });
    const body = await res.json();
    if (!res.ok || body.error) throw new Error(body.error || `HTTP ${res.status}`);
    return body;
  } catch (err) {
    toast(`Could not save: ${err.message}`);
    return null;
  }
}

/** Alternatives for a slot, worst-rated last, excluding what is already on today. */
async function swapOptions(slotKey, excludeIds) {
  const recipes = await allRecipes();
  const feedback = await tryRows('wt_recipe_feedback?select=recipe_id,verdict') || [];
  const verdicts = new Map(feedback.map((f) => [f.recipe_id, f.verdict]));
  const want = slotKey === 'snack' ? 25 : 45;

  let pool = recipes.filter((r) =>
    r.calories_per_serving != null &&
    !(r.tags || []).includes('marinade') &&
    !excludeIds.includes(r.id) &&
    (r.meal_type === slotKey ||
     (slotKey !== 'snack' && slotKey !== 'breakfast' &&
      (r.meal_type === 'lunch' || r.meal_type === 'dinner'))));
  if (!pool.length) pool = recipes.filter((r) => r.calories_per_serving != null && !excludeIds.includes(r.id));

  return pool.sort((a, b) => {
    const va = verdicts.get(a.id), vb = verdicts.get(b.id);
    const rank = (v) => (v === 'like' ? 0 : v === 'dislike' ? 2 : 1);
    if (rank(va) !== rank(vb)) return rank(va) - rank(vb);
    return Math.abs((a.protein_per_serving || 0) - want) - Math.abs((b.protein_per_serving || 0) - want);
  });
}

function openSwap(slot, currentIds, onPick) {
  const sheet = el('swap-sheet');
  el('swap-title').textContent = `Swap ${slot.label.toLowerCase()}`;
  el('swap-sub').textContent = 'Liked recipes first, disliked last';
  el('swap-options').innerHTML = '<p class="caption m-muted">Loading…</p>';
  sheet.hidden = false;

  swapOptions(slot.key, currentIds).then((opts) => {
    el('swap-options').innerHTML = opts.slice(0, 25).map((r, i) => `
      <button class="m-swap${i === 0 ? ' m-swap--best' : ''}" data-id="${r.id}">
        <span class="m-grow">
          <span class="body-strong" style="display:block">${esc(r.title)}</span>
          <span class="caption m-muted">${r.protein_per_serving}g protein</span>
        </span>
        <span class="m-delta caption-strong">${r.calories_per_serving} kcal</span>
      </button>`).join('');
    el('swap-options').querySelectorAll('.opt').forEach((b) =>
      b.addEventListener('click', () => { sheet.hidden = true; onPick(b.dataset.id); }));
  });
}

el('swap-sheet').addEventListener('click', (e) => {

function wireMealActions(plan) {
  const currentIds = plan.filter((p) => p.recipe?.id).map((p) => p.recipe.id);

  el('today-plan').querySelectorAll('.m-acts').forEach((bar) => {

      if (!res) return;
      TG?.HapticFeedback?.impactOccurred?.('medium');

    bar.querySelector('.swap').addEventListener('click', () => {
      openSwap(entry.slot, currentIds, async (newId) => {

        if (!res) return;
        TG?.HapticFeedback?.notificationOccurred?.('success');

        if (!res) return;

/* --- a plan for any date range ------------------------------------------ */

const addDays = (iso, n) => {
  const d = new Date(`${iso}T12:00:00Z`);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};
const weekdayOf = (iso) => new Date(`${iso}T12:00:00Z`).getUTCDay();
const DAY_META = [
  { day: 'Sunday', type: 'full rest', kcal: 1800, protein: 160 },
  { day: 'Monday', type: 'training', kcal: 2200, protein: 180 },
  { day: 'Tuesday', type: 'rest', kcal: 1900, protein: 170 },
  { day: 'Wednesday', type: 'training', kcal: 2200, protein: 180 },
  { day: 'Thursday', type: 'training', kcal: 2200, protein: 180 },
  { day: 'Friday', type: 'training', kcal: 2200, protein: 180 },
  { day: 'Saturday', type: 'rest', kcal: 1900, protein: 170 },
];

/**
 * Saved plan rows for a range, joined to recipes and grouped by date.
 * Returns [] when nothing is saved — the Plan tab says so rather than
 * inventing a fortnight the coach never agreed to.
 */
async function planRange(start, days) {
  const recipes = await allRecipes();
  const jars = await tryRows('wt_prepared_items?select=recipe_id,expires_on,remaining') || [];
  let prepTasksFor, stockFor;
  try {
    ({ prepTasksFor, stockFor } = await import('./batchplan.js'));
  } catch { /* badges are a nicety, not a requirement */ }
  const end = addDays(start, days - 1);
  const rows = await tryRows(
    `wt_coach_daily_plan?select=date,slot,recipe_id,recipe_title,portion,note` +
    `&date=gte.${start}&date=lte.${end}&order=date,slot`);
  if (!rows || !rows.length) return [];

  const byId = new Map(recipes.map((r) => [r.id, r]));
  const byTitle = new Map(recipes.map((r) => [r.title.toLowerCase(), r]));
  const order = { breakfast: 0, lunch: 1, dinner: 2, snack: 3 };
  const byDate = new Map();

  for (const row of rows) {
    const recipe = (row.recipe_id && byId.get(row.recipe_id)) ||
                   byTitle.get((row.recipe_title || '').toLowerCase()) || null;
    // Flag what needs doing before this meal can be made
    let prep = [];
    if (recipe && prepTasksFor) {
      const byTitleAll = new Map(recipes.map((r) => [r.title.toLowerCase(), r]));
      const inStock = new Set(
        jars.filter((j) => Number(j.remaining) > 0 && j.expires_on >= todayISO())
            .map((j) => j.recipe_id));
      prep = prepTasksFor(recipe, byTitleAll, inStock);
    }
    const entry = {
      slot: row.slot,
      title: row.recipe_title,
      portion: Number(row.portion) || 1,
      note: row.note,
      recipe,
      prep,
    };
    if (!byDate.has(row.date)) byDate.set(row.date, []);
    byDate.get(row.date).push(entry);
  }

  return [...byDate.entries()]
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([date, entries]) => {
      entries.sort((a, b) => (order[a.slot] ?? 9) - (order[b.slot] ?? 9));
      const meta = DAY_META[weekdayOf(date)];
      const kcal = entries.reduce((a, e) => a + (e.recipe?.calories_per_serving || 0) * e.portion, 0);
      const protein = entries.reduce((a, e) => a + (e.recipe?.protein_per_serving || 0) * e.portion, 0);
      return { date, meta, entries, kcal: Math.round(kcal), protein: Math.round(protein) };
    });
}

function dayLabel(iso) {
  const d = new Date(`${iso}T12:00:00Z`);
  const today = todayISO();
  if (iso === today) return 'Today';
  if (iso === addDays(today, 1)) return 'Tomorrow';
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
}


/* --- batch cook ---------------------------------------------------------- */

/** Which cook session the Meal prep tab is showing. Survives a re-render, so
    an edit on the days tab doesn't throw the selection back to the first one. */
let batchTab = 0;

async function renderBatch() {
  const host = el('batch-sessions');
  const tabs = el('batch-tabs');
  host.innerHTML = '<p class="caption m-muted">Working out the cook sessions…</p>';

  let upcomingSessions;
  try {
    ({ upcomingSessions } = await import('./batchplan.js'));
  } catch {
    tabs.innerHTML = '';
    host.innerHTML = '<p class="caption m-muted">Batch planning unavailable.</p>';
    return;
  }

  const recipes = await allRecipes();
  const rows = await tryRows(
    `wt_coach_daily_plan?select=date,slot,recipe_id,recipe_title,portion` +
    `&date=gte.${todayISO()}&date=lte.${addDays(todayISO(), 20)}&order=date`) || [];
  const jars = await tryRows(
    'wt_prepared_items?select=recipe_id,made_on,expires_on,remaining') || [];

  const sessions = upcomingSessions(recipes, rows, todayISO(), 2, jars);

  if (!sessions.length) {
    tabs.innerHTML = '';
    host.innerHTML = '<p class="caption m-muted">No cook sessions in the next fortnight.</p>';
    return;
  }

  if (batchTab >= sessions.length) batchTab = 0;

  // The nearest session is whichever comes first — on a Monday that is
  // Wednesday's, not Sunday's — so the tabs are named from the sessions
  // themselves rather than hard-coded.
  tabs.innerHTML = sessions.map((s, i) => {
    const name = s.session.label.replace(/\s*(batch\s*)?cook$/i, '');
    const when = dayLabel(s.cookDate);
    // "Sunday · Tomorrow" is worth saying; "Wednesday · Wed 28 Oct" is not.
    const stamp = when.toLowerCase().startsWith(name.slice(0, 3).toLowerCase()) ? '' : when;
    return `<button class="caption-strong" role="tab" data-i="${i}" aria-selected="${i === batchTab}">
      ${esc(name)}${stamp ? `<span class="m-seg__n">${esc(stamp)}</span>` : ''}
    </button>`;
  }).join('');

  host.innerHTML = sessions.map((s, i) => {
    const head = `<div class="m-row">
        <strong class="title-md m-grow">${esc(s.session.label)}</strong>
        <span class="caption m-muted" style="text-align:right">${dayLabel(s.cookDate)}<br>covers ${esc(s.coversLabel.toLowerCase())}</span>
      </div>`;

    if (s.empty) {
      return `<div class="m-batch batch" data-pane="${i}"${i === batchTab ? '' : ' hidden'}>
        ${head}
        <p class="caption m-muted">Nothing to cook ahead for ${esc(s.coversLabel.toLowerCase())}
          — plan those days first, or everything in them is made fresh.</p>
      </div>`;
    }

    return `<div class="m-batch batch" data-pane="${i}"${i === batchTab ? '' : ' hidden'}>
      ${head}
      <div class="m-batch__meta caption"><span>Hands-on ~${s.handsOn} min</span><span>In the kitchen ~${s.elapsed} min</span><span>${s.totalPortions} portions</span></div>

      ${s.items.length ? `<div class="m-instr">
        <h3 class="m-sect label m-up" style="margin:0">Instructions</h3>
        <ol class="m-steps body">${s.steps.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>
      </div>` : ''}

      ${s.marinadeJobs?.length ? `<div class="m-jar m-block"><strong class="title-sm">Jars</strong>
        <div class="caption m-muted">Marinades keep a week or two — only made when stock runs out</div>
        ${s.marinadeJobs.map((j) => `<details class="m-nest-d${j.makeJar ? '' : ' stocked'}"
            data-marinade="${j.marinade.id}" data-days="${j.keepsDays}">
          <summary class="caption-strong">${j.makeJar ? 'Make' : '✓ In the fridge'} — ${esc(j.marinade.title)}
            <span class="unit m-muted"> · ${j.makeJar
              ? `${j.jarsToMake} jar${j.jarsToMake > 1 ? 's' : ''} of ${j.perJar}, keeps ${j.keepsDays} days`
              : `${j.stock.remaining} left, use by ${j.stock.expiresOn}`}</span></summary>
          <div class="caption m-muted" style="margin-bottom:6px">For ${esc(j.usedBy.join(', '))} · this window needs about ${j.needed}</div>
          ${ingredientList(j.marinade, Math.max(1, j.jarsToMake || 1))}${methodList(j.marinade)}
          ${j.makeJar ? `<button class="m-btn caption-strong jarbtn" data-id="${j.marinade.id}" data-days="${j.keepsDays}">Made a jar</button>` : ''}
        </details>`).join('')}
      </div>` : ''}

      ${s.items.map((it) => `<div class="m-jar m-block">
        <strong class="title-sm">${esc(it.title)}${it.batches > 1 ? ` <span class="unit m-muted">×${it.batches} batches</span>` : ''}</strong>
        <div class="caption m-muted">${Math.ceil(it.portions)} portion${Math.ceil(it.portions) === 1 ? '' : 's'} for ${esc(it.days.join(', '))} ·
          ${it.prepMin} min prep · ${it.cookMin} min cook</div>
        ${it.storage ? `<div class="caption m-muted">${esc(it.storage)}</div>` : ''}
        <details class="m-nest-d"><summary class="caption-strong">Recipe${it.batches > 1 ? ` — quantities ×${it.batches}` : ''}</summary>
          ${recipeDetail(it.recipe, it.batches)}</details>
      </div>`).join('')}


      ${s.prepAhead?.length ? `<div class="m-jar m-block">
        <strong class="title-sm">Prep ahead for the fresh meals<span class="unit m-muted"> · ~${s.prepMinutes} min</span></strong>
        ${s.prepAhead.map((f) => `<div class="m-subitem">
          <strong class="caption-strong">${esc(f.title)}</strong>
          <div class="caption m-muted">${esc(f.days.join(', '))}</div>
          <ul style="margin:5px 0 0;padding-left:19px">${
            f.tasks.map((t) => `<li class="body">${esc(t.text)}${
              t.kind === 'marinade' && t.marinade
                ? `<details class="m-nest-d"><summary class="caption-strong">${esc(t.marinade.title)} — how to make it</summary>
                   ${ingredientList(t.marinade, 1)}${methodList(t.marinade)}</details>`
                : ''}</li>`).join('')}</ul>
          <details class="m-nest-d"><summary class="caption-strong">Full recipe · ${f.prepMin} min prep${
            f.cookMin ? ` + ${f.cookMin} min cook` : ''}</summary>${recipeDetail(f.recipe, 1)}</details>
        </div>`).join('')}
      </div>` : ''}

    </div>`;
  }).join('');

  // Switching a sub-tab only shows a different pane — it never re-renders,
  // because re-rendering is what double-bound the taps last time.
  tabs.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => {
      batchTab = Number(btn.dataset.i);
      tabs.querySelectorAll('button').forEach((b) =>
        b.setAttribute('aria-selected', String(Number(b.dataset.i) === batchTab)));
      host.querySelectorAll('[data-pane]').forEach((pane) => {
        pane.hidden = Number(pane.dataset.pane) !== batchTab;
      });
      TG?.HapticFeedback?.selectionChanged?.();
    });
  });

  // "Made a jar" had markup but no handler — the jar never got recorded, so the
  // next cook session always asked for it again.
  host.querySelectorAll('.jarbtn').forEach((btn) => {
    btn.addEventListener('click', async (ev) => {
      ev.preventDefault();
      const res = await act({ action: 'prep-made', recipeId: btn.dataset.id, days: Number(btn.dataset.days) });
      if (!res) return;
      toast(`Jar logged — use by ${res.expiresOn}`);
      // The days tab's prep chips read jar stock too, so MARINATE/JAR would go
      // stale if only this panel redrew.
      renderPlan();
    });
  });
}

/** Swap, resize or clear any meal on any day, and fill empty slots. */
function wirePlanEditing() {

    bar.querySelector('.swap').addEventListener('click', (ev) => {
      ev.stopPropagation();
      openSwap({ key: slot, label: slot }, recipe ? [recipe] : [], async (recipeId) => {
        const res = await act({ action: 'swap', date, slot, recipeId });
        if (!res) return;
        toast(`${slot} → ${res.title}`);
        refresh();
      });
    });

    bar.querySelectorAll('.portion').forEach((btn) => {
      btn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        const row = bar.closest('.slotdetail')?.previousElementSibling;
        const shown = row?.querySelector('.unit')?.textContent?.match(/×([\d.]+)/);
        const current = shown ? Number(shown[1]) : 1;
        const next = Math.round((current + 0.25 * Number(btn.dataset.dir)) * 100) / 100;
        if (next <= 0 || next > 4) return toast('Portion must be between ¼ and 4');
        const res = await act({ action: 'set-portion', date, slot, portion: next });
        if (!res) return;
        toast(`${slot} ×${next}`);
        refresh();
      });
    });

    bar.querySelector('.clear').addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const res = await act({ action: 'clear-slot', date, slot });
      if (!res) return;
      toast(`${slot} cleared`);
      refresh();
    });
  });
}

let RECIPES = [];
let recipeCatId = 'all';

/* Marinades and bases are repeat jobs rather than meals, and sides are not a
   meal_type of their own, so the tabs are derived rather than taken straight
   from the column. Two recipes carry no meal_type at all; their tags place
   them instead of dropping them into "all" only. */
const RECIPE_CATS = [
  { id: 'all',       label: 'All' },
  { id: 'breakfast', label: 'Breakfast' },
  { id: 'lunch',     label: 'Lunch' },
  { id: 'dinner',    label: 'Dinner' },
  { id: 'snack',     label: 'Snacks' },
  { id: 'side',      label: 'Sides' },
  { id: 'marinade',  label: 'Marinades' },
];

function recipeCat(r) {
  const tags = (r.tags || []).map((t) => String(t).toLowerCase());
  if (tags.includes('marinade') || tags.includes('base')) return 'marinade';
  const mt = String(r.meal_type || '').toLowerCase();
  if (['breakfast', 'lunch', 'dinner', 'snack'].includes(mt)) return mt;
  if (tags.includes('side')) return 'side';
  if (tags.includes('breakfast') || tags.includes('brunch')) return 'breakfast';
  if (tags.includes('dessert') || tags.includes('snack')) return 'snack';
  return 'other';
}

/** Ingredients for today's planned meals, grouped for the aisle. */
let shopDays = 1;

/* Ingredient strings are written for a cook, not a shopper: "onion, diced",
   "boneless chicken thighs, skinless", "rocket (arugula)". Three different
   jobs have to be kept apart.
     - the MERGE KEY decides what counts as the same line
     - the DISPLAY NAME is what you read in the shop, so it keeps the detail
       that matters when buying ("lean beef mince (5% fat)")
     - the AISLE decides where the line sits
   Running them off one mangled lowercase string is what put "chopped tomatoe"
   and "bay leave" on the list and filed beef stock under Proteins. */

/** Things that appear in a recipe but are not bought. */
const NOT_SHOPPING = /^(ice cubes?|cold water( or coconut water)?|water|tap water|boiling water)$/i;

/** Not a raw ingredient — a thing that is cooked, jarred or bought ready-made.
    These get their own group, because "stewed beef offal" on a shopping list
    with no dish beside it is unreadable. */
const READY_MADE = /\b(stewed|pre-?made|puff ?puff|akara|marinade|sofrito)\b/i;

/* Aisle rules, tested in order — the first match wins, so the cupboard
   markers come first. "garlic powder" is a spice and not produce; "beef
   stock" is a carton and not meat; "tomato puree" is a tin. */
const AISLES = [
  ['Proteins', /\bprotein powder\b/i],
  // flesh and dairy before anything else, or "hot-smoked salmon flakes" is
  // filed by "flakes" and "raw king prawns" by "raw". Stock is the exception:
  // "beef stock" is a carton.
  ['Proteins', /\b(chicken|beef|turkey|pork|lamb|salmon|tuna|mackerel|prawns?|fish|offal|eggs?|mince)\b(?!.*\bstock\b)/i],
  ['Cupboard', /\b(peanut|almond|cashew|nut) butter\b/i],
  ['Proteins', /yogh?urt|feta|mozzarella|cheddar|cheese|\bmilk\b|butter/i],
  ['Produce', /^(fresh|baby|raw|ripe)\b/i],
  ['Cupboard', /\b(powder|ground|dried|flakes?|seeds?|stock|cube|sauce|paste|puree|tinned|canned|vinegar|oil|honey|syrup|mirin|gochujang|mayonnaise|breadcrumbs?|flour|rice|oats?|bread|pasta|noodles?|beans?|lentils?|chickpeas?|nuts?|almonds?|walnuts?|peanut|crayfish|seasoning|paprika|cumin|oregano|cinnamon|nutmeg|allspice|cayenne|curry|turmeric|bay leaves?)\b/i],
  ['Cupboard', /\b(black|white|cayenne|chilli|ground) pepper\b|^pepper$|^salt\b|\bsea salt\b|salt and (black )?pepper|peppercorn|\bthyme\b(?!.*fresh)/i],
  ['Produce', /pepper|onion|garlic|spinach|tomato|lemon|lime|plantain|avocado|herb|coriander|parsley|dill|chive|rocket|ginger|beetroot|blueberr|banana|broccoli|mushroom|cabbage|carrot|cucumber|chilli|scotch bonnet|salad|leaves|chard|greens|radicchio|\byam\b|potato|fruit|fries|chips/i],
];

/* Variants of one thing that should be a single line. The value is also what
   the line is called, so it reads the way you would write it down. */
const SYNONYMS = [
  [/^(boneless |bone-in )?chicken thighs?\b.*/, 'Chicken thighs'],
  [/^chicken breast.*/, 'Chicken breast'],
  [/^(whole )?eggs?$/, 'Eggs'],
  [/^feta( cheese)?$/, 'Feta'],
  [/^(baby |fresh )?spinach$/, 'Spinach'],
  [/^salmon fillets?\b.*/, 'Salmon fillets'],
  [/^(extra virgin )?olive oil$/, 'Olive oil'],
  [/^greek yogh?urt.*/, 'Greek yoghurt (0% fat)'],
  [/^(red |white )?onions?$/, 'Onion'],
  [/^garlic cloves?$/, 'Garlic cloves'],
  [/^lemons?$/, 'Lemon'],
  [/^(red bell|red) peppers?$/, 'Red pepper'],
  [/^spring onions?$/, 'Spring onion'],
  [/^(tinned )?plum tomatoes?$/, 'Tinned plum tomatoes'],
  [/^(tinned )?chopped tomatoes?$/, 'Tinned chopped tomatoes'],
  [/^(red )?kidney beans?$/, 'Red kidney beans'],
  [/^scotch bonnet( chilli| pepper| or chilli)?$/, 'Scotch bonnet'],
  [/^(sea )?salt$/, 'Salt'],
  [/^(black )?pepper$/, 'Black pepper'],
  [/^salt and (black )?pepper$/, 'Salt and black pepper'],
  [/^fresh thyme( leaves)?$/, 'Fresh thyme'],
  [/^(dried thyme|thyme, dried|thyme)$/, 'Dried thyme'],
  [/^vegetable oil( for frying)?$/, 'Vegetable oil'],
  [/^(ground )?crayfish$/, 'Ground crayfish'],
  [/^red lentils?$/, 'Red lentils'],
];

/* The unit field holds whatever the recipe writer typed: "cloves" and "clove",
   "kg" and "g", and sometimes a prep instruction ("halved") where a unit
   should be. Left alone that splits one line into two half-quantities. */
const UNIT_COUNT = ['whole', 'large', 'medium', 'small', 'piece', 'pieces',
  'halved', 'sliced', 'chopped', 'diced', 'crushed', 'minced'];

/** Returns [canonical unit, multiplier to apply to the quantity]. */
function normaliseUnit(raw) {
  const u = String(raw || '').toLowerCase().trim();
  if (!u || UNIT_COUNT.includes(u)) return ['', 1];
  if (u === 'kg') return ['g', 1000];
  if (u === 'l' || u === 'litre' || u === 'litres') return ['ml', 1000];
  if (u === 'tbs' || u === 'tbsp.') return ['tbsp', 1];
  if (/(ch|sh|x)es$/.test(u)) return [u.slice(0, -2), 1];
  if (u.length > 2 && u.endsWith('s') && !u.endsWith('ss')) return [u.slice(0, -1), 1];
  return [u, 1];
}

/** Spoons are volume, so they fold into ml for anything already measured in ml. */
function foldSpoons(units) {
  if (!units.has('ml')) return units;
  const out = new Map(units);
  for (const [u, mult] of [['tbsp', 15], ['tsp', 5]]) {
    if (out.has(u)) { out.set('ml', out.get('ml') + out.get(u) * mult); out.delete(u); }
  }
  return out;
}

/** Merge key — aggressive, never shown. */
function ingredientKey(name) {
  const base = name.toLowerCase().replace(/\s*\(.*?\)\s*/g, ' ').replace(/\s+/g, ' ').trim();
  for (const [re, to] of SYNONYMS) if (re.test(base)) return to.toLowerCase();
  return base.replace(/ies$/, 'y').replace(/([^s])s$/, '$1');
}

/** What a synonym renamed this to, if anything. */
function ingredientSynonym(name) {
  const base = name.toLowerCase().replace(/\s*\(.*?\)\s*/g, ' ').replace(/\s+/g, ' ').trim();
  for (const [re, to] of SYNONYMS) if (re.test(base)) return to;
  return null;
}

function ingredientAisle(name) {
  if (READY_MADE.test(name)) return 'Make or buy ahead';
  for (const [aisle, re] of AISLES) if (re.test(name)) return aisle;
  return 'Other';
}

async function renderShopping() {
  await allRecipes();
  let meals = [];
  // Plan rows the library cannot answer for. Dropping them silently is how a
  // shopping list ends up short without saying so.
  const gaps = [];

  // Every line has to say which dish it is for — "stewed beef offal" means
  // nothing until you know it is the Nigerian Breakfast Plate — so the recipe
  // title travels with the ingredient, not just the day.
  if (shopDays === 1) {
    const plan = await todaysPlan();
    for (const p of plan || []) {
      if (!p.recipe) continue;
      if (!(p.recipe.ingredients || []).length) { gaps.push(p.recipe.title); continue; }
      meals.push({ recipe: p.recipe, portion: p.portion || 1, title: p.recipe.title, when: 'Today' });
    }
    el('shopping-sub').textContent = meals.length
      ? `For today's ${meals.length} meals`
      : 'Nothing planned for today';
  } else {
    const days = await planRange(todayISO(), shopDays);
    for (const d of days) {
      for (const e of d.entries) {
        const name = e.recipe?.title || e.title;
        if (!e.recipe || !(e.recipe.ingredients || []).length) { if (name) gaps.push(name); continue; }
        meals.push({ recipe: e.recipe, portion: e.portion, title: e.recipe.title, when: dayLabel(d.date) });
      }
    }
    el('shopping-sub').textContent = days.length
      ? `For ${days.length} planned days — ${meals.length} meals`
      : `Nothing planned for the next ${shopDays} days`;
  }

  if (!meals.length) {
    el('shopping-list').innerHTML =
      `<p class="caption m-muted">No meals planned for this range. Ask Coach to plan the week.</p>`;
    return;
  }

  /* A recipe can ask for something that is itself a recipe — "4 tbsp jerk
     marinade (see Jerk Marinade)". Left at that, the list says "jerk marinade"
     and never mentions the spring onions, scotch bonnet or allspice that go in
     it. Marinades are made a jar at a time, so demand is summed in tbsp,
     turned into whole jars against what is already in the fridge, and the
     jar's own ingredients join the list named for the dish that needs them. */
  const jarRows = await tryRows(
    'wt_prepared_items?select=recipe_id,expires_on,remaining') || [];
  const jarStock = new Map(jarRows
    .filter((j) => Number(j.remaining) > 0 && j.expires_on >= todayISO())
    .map((j) => [j.recipe_id, Number(j.remaining)]));

  const byTitle = new Map(RECIPES.map((r) => [r.title.toLowerCase(), r]));
  const subNeed = new Map();
  for (const { recipe, portion, title } of meals) {
    const serves = recipe.servings || 1;
    for (const g of recipe.ingredients || []) {
      const ref = /\(see ([^)]+)\)/i.exec(g.item || '');
      const sub = ref && byTitle.get(ref[1].trim().toLowerCase());
      if (!sub) continue;
      const prev = subNeed.get(sub.id) || {
        sub, qty: 0, dishes: new Set(),
        key: ingredientKey((g.item || '').replace(/,.*$/, '').trim()),
      };
      prev.qty += (Number(g.quantity) || 0) / serves * portion;
      prev.dishes.add(title);
      subNeed.set(sub.id, prev);
    }
  }

  // What the marinade's own line should read instead of a tbsp total.
  const jarLine = new Map();
  // Dishes you could not have worked out for yourself — these go first on the
  // "for" line, because "spring onion, +4 more" hides the only answer you need.
  const subTitles = new Set();
  for (const need of subNeed.values()) {
    const short = Math.max(0, need.qty - (jarStock.get(need.sub.id) || 0));
    const perJar = need.sub.servings || 8;
    const toMake = short > 0 ? Math.ceil(short / perJar) : 0;
    jarLine.set(need.key, toMake ? `${toMake} jar${toMake > 1 ? 's' : ''}` : 'in the fridge');
    // The Plan tab already says this one is in the fridge; don't send him out
    // for its ingredients as well.
    if (!toMake) continue;
    const dishes = [...need.dishes];
    const title = `${need.sub.title} (${dishes.slice(0, 2).join(', ')}` +
                  `${dishes.length > 2 ? ` +${dishes.length - 2}` : ''})`;
    subTitles.add(title);
    meals.push({ recipe: need.sub, portion: toMake, wholeBatch: true, title });
  }

  // Recipes list quantities for the whole batch, so a 1000g/5-serving tray is
  // 200g for one plate. Everything is reduced to per-serving before scaling by
  // the portion the plan calls for.
  const items = new Map();
  for (const { recipe, portion, title, wholeBatch } of meals) {
    const serves = wholeBatch ? 1 : (recipe.servings || 1);
    for (const g of recipe.ingredients || []) {
      const full = (g.item || '').trim();
      const name = full.replace(/,.*$/, '').trim();
      if (!name || NOT_SHOPPING.test(name)) continue;

      const key = ingredientKey(name);
      const prev = items.get(key) || {
        key, names: [], aisle: ingredientAisle(name),
        units: new Map(), dishes: new Map(),
      };
      prev.names.push(name);
      if (g.quantity) {
        const [unit, scale] = normaliseUnit(g.unit);
        prev.units.set(unit, (prev.units.get(unit) || 0) + (g.quantity * scale / serves) * portion);
      }
      prev.dishes.set(title, (prev.dishes.get(title) || 0) + 1);
      items.set(key, prev);
    }
  }

  // Shown name: whatever a synonym renamed it to, else the shortest spelling
  // seen — the shortest is the one without the chopping instruction attached.
  for (const it of items.values()) {
    const syn = ingredientSynonym(it.names[0]);
    const shortest = [...it.names].sort((a, b) => a.length - b.length)[0]
      .replace(/\s*\(see [^)]*\)/i, '');
    it.name = syn || shortest.charAt(0).toUpperCase() + shortest.slice(1);
  }

  // Round sensibly: grams and ml to whole numbers, counts and spoons to a half.
  // Never round down to nothing — a sixth of a stock cube is still one cube to
  // buy, and "0 cube" on a shopping list is just wrong.
  const fmt = (n, unit) => {
    if (unit === 'g' || unit === 'ml') return String(Math.max(1, Math.round(n)));
    const half = Math.round(n * 2) / 2;
    return String(half || Math.round(n * 10) / 10 || 1);
  };

  const saved = JSON.parse(localStorage.getItem(`wt-shopping-${todayISO()}-${shopDays}`) || '{}');
  const byAisle = {};
  for (const it of items.values()) (byAisle[it.aisle] ||= []).push(it);

  el('shopping-list').innerHTML = ['Proteins', 'Produce', 'Cupboard', 'Make or buy ahead', 'Other']
    .filter((g) => byAisle[g]?.length)
    .map((g) => {
      const list = byAisle[g].sort((a, b) => a.name.localeCompare(b.name));
      return `<div class="m-day">
        <div class="m-group"><span class="label m-up">${g}</span>
          <span class="caption m-faint">${list.length}</span></div>
        ${list.map((it) => {
          // The id is built from the merge key, never the shown name, so a
          // wording change does not orphan everything already ticked off.
          const id = 's-' + btoa(unescape(encodeURIComponent(it.key))).replace(/=/g, '');
          const units = foldSpoons(it.units);
          const qty = jarLine.get(it.key) || (units.size
            ? [...units.entries()].map(([u, n]) => `${fmt(n, u)}${u ? ' ' + u : ''}`).join(' + ')
            : '');
          const dishes = [...it.dishes.entries()]
            .sort((a, b) => (subTitles.has(b[0]) ? 1 : 0) - (subTitles.has(a[0]) ? 1 : 0))
            .map(([t, n]) => n > 1 ? `${t} ×${n}` : t);
          const forLine = dishes.slice(0, 2).join(', ') +
            (dishes.length > 2 ? ` +${dishes.length - 2} more` : '');
          return `<button class="m-ing" role="checkbox" id="${id}" aria-checked="${saved[id] ? 'true' : 'false'}">
            <span class="m-ing__box">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
            </span>
            <span class="m-grow">
              <span class="m-ing__name body">${esc(it.name)}</span>
              <span class="m-ing__for caption">${esc(forLine)}</span>
            </span>
            <span class="m-ing__qty caption-strong">${esc(qty)}</span>
          </button>`;
        }).join('')}
      </div>`;
    }).join('');

  // Say what the list could not account for rather than quietly running short.
  if (gaps.length) {
    const names = [...new Set(gaps)];
    el('shopping-list').insertAdjacentHTML('beforeend',
      `<p class="caption m-muted" style="margin-top:12px">Not on this list: ` +
      `${names.map(esc).join(', ')} — no ingredients recorded for ` +
      `${names.length > 1 ? 'those' : 'that'} yet.</p>`);
  }

  el('shopping-list').querySelectorAll('.m-ing').forEach((box) => {
    box.addEventListener('click', () => {
      const now = box.getAttribute('aria-checked') !== 'true';
      box.setAttribute('aria-checked', String(now));
      const key = `wt-shopping-${todayISO()}-${shopDays}`;
      const state = JSON.parse(localStorage.getItem(key) || '{}');
      state[box.id] = now;
      localStorage.setItem(key, JSON.stringify(state));
      TG?.HapticFeedback?.impactOccurred?.('light');
    });
  });
}

async function renderScorecard() {
  const since = new Date(Date.now() - 6 * 864e5).toLocaleDateString('en-CA');
  const days   = await tryRows(`wt_daily_nutrition_summary?select=*&summary_date=gte.${since}&order=summary_date.asc`);
  const energy = await tryRows(`wt_energy_scores?select=date,score&date=gte.${since}`) || [];
  const batch  = await tryRows(`wt_batch_cook_logs?select=date,completed&date=gte.${since}`) || [];

  if (days === null) {
    el('scorecard').innerHTML = `<div class="m-error">
      <strong class="title-sm">Can't read this week</strong>
      <span class="caption">The daily totals table isn't reachable.</span></div>`;
    return;
  }
  if (!days.length) {
    el('scorecard').innerHTML = `<div class="m-empty">
      <span class="body">Nothing logged yet this week.</span>
      <span class="caption">Tick meals off on Today and this fills in.</span></div>`;
    return;
  }

  const hit = days.filter((d) => (d.total_protein_g || 0) >= 160).length;
  const avgKcal = Math.round(days.reduce((a, d) => a + (d.total_calories || 0), 0) / days.length);
  const avgProt = Math.round(days.reduce((a, d) => a + (d.total_protein_g || 0), 0) / days.length);
  const avgEnergy = energy.length ? (energy.reduce((a, e) => a + e.score, 0) / energy.length).toFixed(1) : '—';

  el('scorecard').innerHTML = `<div class="m-metric"><div class="m-score">
    ${[['Protein hit', `${hit}/${days.length}`],
       ['Avg calories', `${avgKcal}`],
       ['Avg protein', `${avgProt}g`],
       ['Avg energy', avgEnergy],
       ['Batch cooks', `${batch.filter((b) => b.completed).length}/2`],
       ['Days logged', `${days.length}/7`]]
      .map(([k, v]) => `<div class="m-score__cell">
        <span class="label m-up m-muted">${k}</span>
        <span class="metric">${v}</span></div>`).join('')}
  </div>
  ${sparkline(days.map((d) => d.total_protein_g || 0))}
  <p class="caption m-muted" style="margin:6px 0 0">Daily protein, last ${days.length} days</p></div>`;
}

/* --- shell ---------------------------------------------------------------- */

const VIEWS = {
  today: renderToday,
  plan: renderPlan,
  recipes: renderRecipes,
  shopping: renderShopping,
  progress: async () => { await renderScorecard(); await renderProgress(); },
};

function show(name) {
  for (const key of Object.keys(VIEWS)) el(`view-${key}`).hidden = key !== name;
  document.querySelectorAll('.m-tab').forEach((b) =>
    b.setAttribute('aria-selected', String(b.dataset.view === name)));
  VIEWS[name]();
}

document.querySelectorAll('.m-tab').forEach((b) =>
  b.addEventListener('click', () => { show(b.dataset.view); TG?.HapticFeedback?.selectionChanged?.(); }));

el('recipe-search').addEventListener('input', (e) => drawRecipes(e.target.value));

function wireSegment(id, onPick) {
  el(id).addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    el(id).querySelectorAll('button').forEach((b) =>
      b.setAttribute('aria-selected', String(b === btn)));
    TG?.HapticFeedback?.selectionChanged?.();
    onPick(Number(btn.dataset.days));
  });
}
wireSegment('plan-range', (d) => { planDays = d; renderPlan(); });
wireSegment('shop-range', (d) => { shopDays = d; renderShopping(); });

/* The days / Meal prep. Both panels are already rendered, so switching only
   toggles them — calling renderPlan() here would re-bind every row handler. */
el('plan-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  el('plan-tabs').querySelectorAll('button').forEach((b) =>
    b.setAttribute('aria-selected', String(b === btn)));
  el('plan-panel-days').hidden = btn.dataset.panel !== 'days';
  el('plan-panel-prep').hidden = btn.dataset.panel !== 'prep';
  TG?.HapticFeedback?.selectionChanged?.();
});

/* Telegram chooses which WellTrack variant to show and owns the chrome at the
   edges. It does not colour the content: the seven --tg-theme-* variables it
   injects are read by wt-tokens.css behind WellTrack fallbacks. */
function applyTheme() {
  const dark = (TG?.colorScheme ?? 'dark') !== 'light';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const bg = TG?.themeParams?.bg_color;
  const card = TG?.themeParams?.secondary_bg_color;
  try {
    if (bg) TG?.setBackgroundColor?.(bg);
    if (card) TG?.setHeaderColor?.(card);
    if (card) TG?.setBottomBarColor?.(card);
  } catch { /* older Telegram clients do not have all three */ }
}

if (TG) {
  TG.ready();
  TG.expand?.();
  applyTheme();
  TG.onEvent?.('themeChanged', applyTheme);
} else {
  // Outside Telegram follow the OS, so the design can be checked both ways
  const mq = window.matchMedia('(prefers-color-scheme: light)');
  const setFromOS = () => document.documentElement.setAttribute('data-theme', mq.matches ? 'light' : 'dark');
  setFromOS();
  mq.addEventListener?.('change', setFromOS);
}

if (!CFG.url || !CFG.anonKey) {
  document.querySelector('main').innerHTML =
    `<h1>Not configured</h1><div class="m-error caption">Copy <code>config.example.js</code> to <code>config.js</code> and fill in your Supabase URL and anon key.</div>`;
} else {
  show('today');
}
</script>

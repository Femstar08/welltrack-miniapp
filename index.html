<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WellTrack</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<script src="workouts.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #1c1c1e;
    --hint: #8e8e93;
    --link: #2481cc;
    --button: #2481cc;
    --button-text: #ffffff;
    --secondary-bg: #f2f2f7;
    --border: rgba(120,120,128,0.18);
    --ok: #2f9e44;
    --warn: #e8a317;
    --bad: #e03131;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: 0 16px calc(76px + env(safe-area-inset-bottom));
    max-width: 680px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 18px 0 2px; letter-spacing: -0.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--hint); margin: 22px 0 8px; font-weight: 600; }
  .sub { color: var(--hint); font-size: 13px; margin: 0 0 14px; }

  .card {
    background: var(--secondary-bg);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
  }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .big { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .unit { color: var(--hint); font-size: 13px; font-weight: 400; }

  .bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 9px; }
  .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--button); transition: width .45s cubic-bezier(.2,.7,.3,1); }
  .bar.over > i { background: var(--warn); }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { background: var(--secondary-bg); border-radius: var(--radius); padding: 12px 13px; }
  .tile .k { color: var(--hint); font-size: 12px; margin-bottom: 3px; }
  .tile .v { font-size: 20px; font-weight: 640; letter-spacing: -0.02em; }

  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--border); color: var(--text); margin-right: 5px; }
  .status { font-size: 12px; font-weight: 600; }
  .status.ok { color: var(--ok); } .status.warn { color: var(--warn); }
  .status.bad { color: var(--bad); } .status.none { color: var(--hint); }

  input[type=search] {
    width: 100%; padding: 11px 13px; font-size: 15px; color: var(--text);
    background: var(--secondary-bg); border: 0; border-radius: 11px; margin-bottom: 10px;
    font-family: inherit;
  }
  input[type=search]::placeholder { color: var(--hint); }

  .recipe { cursor: pointer; }
  .recipe .row { align-items: center; }
  .recipe h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .macros { color: var(--hint); font-size: 12.5px; margin-top: 3px; }
  .detail { display: none; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
  .recipe.open .detail { display: block; }
  .detail ul, .detail ol { margin: 6px 0 0; padding-left: 20px; }
  .detail li { margin-bottom: 4px; }

  label.check { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--border); }
  label.check:last-child { border-bottom: 0; }
  label.check input { width: 19px; height: 19px; accent-color: var(--button); }
  label.check.done span { text-decoration: line-through; color: var(--hint); }
  label.check em.qty { font-style: normal; color: var(--hint); }
  label.check em.for { display: block; font-style: normal; font-size: 11.5px; color: var(--hint); }

  .acts { display: flex; gap: 6px; margin-top: 11px; }
  .acts button {
    flex: 1; border: 0; border-radius: 9px; padding: 8px 4px; cursor: pointer;
    background: var(--bg); color: var(--text); font: 600 12.5px/1 inherit;
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .acts button[aria-pressed="true"] { background: var(--ok); color: #fff; box-shadow: none; }
  .acts button.rate[aria-pressed="true"] { background: var(--button); color: var(--button-text); }
  .acts button:disabled { opacity: .5; }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45);
           display: flex; align-items: flex-end; z-index: 40; }
  .sheet[hidden] { display: none; }
  .sheet > div { background: var(--bg); width: 100%; max-height: 78vh; overflow-y: auto;
                 border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 4px; font-size: 16px; }
  .sheet .opt { width: 100%; text-align: left; border: 0; background: var(--secondary-bg);
                border-radius: 11px; padding: 11px 13px; margin-top: 8px; cursor: pointer;
                color: var(--text); font: inherit; }
  .sheet .opt .m { color: var(--hint); font-size: 12.5px; margin-top: 2px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 86px;
           background: var(--text); color: var(--bg); padding: 9px 15px; border-radius: 99px;
           font-size: 13px; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .seg { display: flex; gap: 6px; margin-bottom: 12px; }
  .seg button {
    flex: 1; border: 0; border-radius: 9px; padding: 8px 4px; cursor: pointer;
    background: var(--secondary-bg); color: var(--hint);
    font: 600 12.5px/1 inherit;
  }
  .seg button[aria-pressed="true"] { background: var(--button); color: var(--button-text); }
  .slotline.tappable { cursor: pointer; }
  .slotline.tappable .t::after { content: ' ›'; color: var(--hint); }
  .slotline.open .t::after { content: ' ⌄'; }
  .slotdetail { padding: 4px 0 12px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .slotdetail ul, .slotdetail ol { margin: 6px 0 0; padding-left: 20px; }
  .slotdetail li { margin-bottom: 4px; }
  details.sub-recipe { margin-top: 12px; padding: 10px 12px; border-radius: 10px;
                       background: var(--bg); box-shadow: inset 0 0 0 1px var(--border); }
  details.sub-recipe summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  details.sub-recipe.stocked summary { color: var(--ok); }
  details.sub-recipe.todo summary { color: var(--warn); }
  .jarbtn { margin-top: 10px; border: 0; border-radius: 9px; padding: 9px 14px; cursor: pointer;
            background: var(--button); color: var(--button-text); font: 600 13px/1 inherit; }
  .prepflag { font-size: 11px; margin-left: 5px; }
  .prepbox { background: var(--bg); box-shadow: inset 0 0 0 1px var(--border);
             border-radius: 10px; padding: 9px 12px; margin-bottom: 10px; font-size: 13px; }
  .prepbox ul { margin: 5px 0 0; padding-left: 18px; }
  .batch .row + .row { margin-top: 2px; }
  .batch ol { margin: 10px 0 0; padding-left: 20px; font-size: 13.5px; }
  .batch ol li { margin-bottom: 5px; }
  .batch .item { padding: 8px 0; border-top: 1px solid var(--border); }
  .batch .item:first-of-type { border-top: 0; }
  .batch .item .m { color: var(--hint); font-size: 12.5px; margin-top: 2px; }
  .batch .fresh { margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--border);
                  color: var(--hint); font-size: 12.5px; }
  .dayhead { display: flex; align-items: baseline; justify-content: space-between;
             margin: 18px 0 7px; gap: 8px; }
  .dayhead strong { font-size: 14px; }
  .dayhead .totals { font-size: 12px; color: var(--hint); white-space: nowrap; }
  .dayhead .totals.short { color: var(--warn); }
  .slotline { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0;
              border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .slotline:last-child { border-bottom: 0; }
  .slotline .s { color: var(--hint); width: 74px; flex: none; font-size: 12px; padding-top: 1px; }
  .slotline .t { flex: 1; }
  .slotline .m { color: var(--hint); font-size: 12px; white-space: nowrap; }
  table.ex { width: 100%; border-collapse: collapse; margin-top: 11px; font-size: 13.5px; }
  table.ex th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
                color: var(--hint); font-weight: 600; padding: 0 0 5px; }
  table.ex th.num, table.ex td.num { text-align: right; white-space: nowrap; padding-left: 8px; }
  table.ex td { padding: 5px 0; border-top: 1px solid var(--border); vertical-align: top; }
  table.ex tr.note td { border-top: 0; padding: 0 0 5px; color: var(--hint); font-size: 12px; }
  .circuit { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .deload { margin-top: 9px; padding: 8px 10px; border-radius: 9px; font-size: 12.5px;
            background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--text); }
  details.rules { margin-top: 12px; font-size: 12.5px; color: var(--hint); }
  details.rules summary { cursor: pointer; }
  details.rules ul { margin: 6px 0 0; padding-left: 18px; }
  svg.spark { width: 100%; height: 56px; display: block; margin-top: 8px; overflow: visible; }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; background: var(--bg);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: 0; background: none; color: var(--hint);
    font: 500 10.5px/1.1 inherit; padding: 9px 2px 10px; cursor: pointer;
  }
  nav button em { display: block; font-size: 19px; font-style: normal; margin-bottom: 3px; }
  nav button[aria-current="true"] { color: var(--link); }

  .empty { color: var(--hint); font-size: 13.5px; padding: 10px 0; }
  .err { color: var(--bad); font-size: 13px; background: var(--secondary-bg); padding: 11px 13px; border-radius: 11px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<main>
  <section id="view-today">
    <h1>Today</h1>
    <p class="sub" id="today-sub">—</p>
    <div id="today-macros"></div>
    <h2>Today's meals</h2>
    <div id="today-plan"></div>
    <h2>Session</h2>
    <div id="today-session"></div>
    <h2>Streaks</h2>
    <div class="grid" id="today-streaks"></div>
  </section>

  <section id="view-plan" hidden>
    <h1>Meal plan</h1>
    <p class="sub" id="plan-sub">What's coming up</p>
    <div class="seg" id="plan-range">
      <button data-days="7" aria-pressed="true">This week</button>
      <button data-days="14">Two weeks</button>
    </div>
    <h2>Batch cook</h2>
    <div id="batch-sessions"></div>
    <h2>The days</h2>
    <div id="plan-days"></div>
  </section>

  <section id="view-progress" hidden>
    <h1>Progress</h1>
    <h2>Last 7 days</h2>
    <div id="scorecard"></div>
    <h2>Against the glide path</h2>
    <p class="sub" id="progress-sub">—</p>
    <div id="progress-list"></div>
  </section>

  <section id="view-recipes" hidden>
    <h1>Recipes</h1>
    <input type="search" id="recipe-search" placeholder="Search name, cuisine or tag" autocomplete="off" />
    <div id="recipe-list"></div>
  </section>

  <section id="view-shopping" hidden>
    <h1>Ingredients</h1>
    <p class="sub" id="shopping-sub">For today's meals</p>
    <div class="seg" id="shop-range">
      <button data-days="1" aria-pressed="true">Today</button>
      <button data-days="3">3 days</button>
      <button data-days="7">Week</button>
      <button data-days="14">Fortnight</button>
    </div>
    <div id="shopping-list"></div>
  </section>


</main>

<div class="sheet" id="swap-sheet" hidden><div>
  <h3 id="swap-title">Swap meal</h3>
  <p class="sub" id="swap-sub">Pick a replacement</p>
  <div id="swap-options"></div>
</div></div>
<div class="toast" id="toast"></div>

<nav>
  <button data-view="today" aria-current="true"><em>📊</em>Today</button>
  <button data-view="plan"><em>🗓️</em>Plan</button>
  <button data-view="progress"><em>📈</em>Progress</button>
  <button data-view="recipes"><em>🍳</em>Recipes</button>
  <button data-view="shopping"><em>🛒</em>Ingredients</button>
</nav>

<script>
/* ---------------------------------------------------------------------------
 * WellTrack mini app
 *
 * Reads the same Supabase tables the Telegram coach writes and the Flutter app
 * syncs — wt_recipes, wt_meals / wt_meal_items / wt_daily_nutrition_summary,
 * and the coach tracking tables (wt_weigh_ins, wt_energy_scores, ...).
 *
 * It is read-only on purpose: the coach owns writes, using the secret key.
 * Anything this page cannot read (RLS, or a table that does not exist yet)
 * degrades to an explicit message rather than a blank panel.
 * ------------------------------------------------------------------------- */

const CFG = window.WELLTRACK_CONFIG || {};
const TG = window.Telegram?.WebApp;

/* The plan's fixed constants, mirrored from health/6-month-transformation-plan.md */
const PLAN_START = new Date('2026-10-26T00:00:00+01:00');   // Week 1, Monday
const DAYS = [
  { name: 'Sunday',    session: 'Full rest + batch cook', type: 'full rest', kcal: 1800, protein: 160 },
  { name: 'Monday',    session: 'Upper Push',             type: 'training',  kcal: 2200, protein: 180 },
  { name: 'Tuesday',   session: 'Rest + 30 min walk',     type: 'rest',      kcal: 1900, protein: 170 },
  { name: 'Wednesday', session: 'Back & Pull',            type: 'training',  kcal: 2200, protein: 180 },
  { name: 'Thursday',  session: 'Lower Body',             type: 'training',  kcal: 2200, protein: 180 },
  { name: 'Friday',    session: 'Core + Conditioning',    type: 'training',  kcal: 2200, protein: 180 },
  { name: 'Saturday',  session: 'Walk 30–45 min',         type: 'rest',      kcal: 1900, protein: 170 },
];

/* Glide path from the agent spec. month1/3/6 are the milestone targets. */
const GLIDE = [
  { key: 'weight',    label: 'Weight',            unit: 'kg', start: 91.5, m1: 90.5, m3: 88.5, m6: 86,  dir: 'down' },
  { key: 'protein',   label: 'Protein hit rate',  unit: '%',  start: 0,    m1: 70,   m3: 85,   m6: 90,  dir: 'up' },
  { key: 'plank',     label: 'Plank hold',        unit: 's',  start: 0,    m1: 45,   m3: 60,   m6: 90,  dir: 'up' },
  { key: 'circuit',   label: 'Circuit rounds',    unit: '',   start: 1.5,  m1: 3,    m3: 4,    m6: 4.5, dir: 'up' },
  { key: 'energy',    label: 'Energy (1–5 avg)',  unit: '',   start: 0,    m1: 3.0,  m3: 3.5,  m6: 4.0, dir: 'up' },
  { key: 'supps',     label: 'Supplement compliance', unit: '%', start: 0, m1: 80,   m3: 90,   m6: 95,  dir: 'up' },
];

const todayISO = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/London' });
const dayInfo   = () => DAYS[new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/London' })).getDay()];
const planWeek  = () => {
  const w = Math.floor((Date.now() - PLAN_START.getTime()) / 6048e5) + 1;
  return w < 1 ? 0 : w;
};

/* --- data access ---------------------------------------------------------- */

async function sb(path) {
  if (!CFG.url || !CFG.anonKey) throw new Error('config-missing');
  const res = await fetch(`${CFG.url}/rest/v1/${path}`, {
    headers: {
      apikey: CFG.anonKey,
      Authorization: `Bearer ${CFG.token || CFG.anonKey}`,
      Accept: 'application/json',
    },
  });
  if (res.status === 404) throw new Error('table-missing');
  if (!res.ok) throw new Error(`http-${res.status}`);
  return res.json();
}

/** Returns rows, or null when the table is unreadable — callers show why. */
async function tryRows(path) {
  try { return await sb(path); } catch { return null; }
}

/* --- rendering helpers ---------------------------------------------------- */

const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function macroCard(label, value, target, unit) {
  const pct = target ? Math.min(100, Math.round((value / target) * 100)) : 0;
  const over = target && value > target;
  return `<div class="card">
    <div class="row">
      <strong>${label}</strong>
      <span class="big">${Math.round(value)}<span class="unit"> / ${target}${unit}</span></span>
    </div>
    <div class="bar${over ? ' over' : ''}"><i style="width:${pct}%"></i></div>
  </div>`;
}

function statusFor(current, target, dir, points) {
  if (points < 3) return ['none', '⏸️ Insufficient data'];
  const progress = dir === 'down' ? (91.5 - current) / (91.5 - target) : current / target;
  if (progress >= 1) return ['ok', '✅ On track'];
  if (progress >= 0.75) return ['warn', '⚠️ At risk'];
  return ['bad', '🔴 Off track'];
}

function sparkline(values) {
  if (values.length < 2) return '';
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * 100;
    const y = 50 - ((v - min) / span) * 44;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg class="spark" viewBox="0 0 100 56" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="var(--link)" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
  </svg>`;
}



/* --- the day's workout, in full ----------------------------------------- */

function workoutBlock(week) {
  const idx = new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/London' })).getDay();
  const w = (window.WELLTRACK_WORKOUTS || {})[idx];
  const rules = window.WELLTRACK_TRAINING_RULES || [];
  if (!w) return `<div class="card"><strong>${dayInfo().session}</strong></div>`;

  const deload = week && week % 4 === 0;
  const row = (e) => `<tr>
      <td>${esc(e.name)}</td>
      <td class="num">${esc(e.sets || e.detail || '')}</td>
      <td class="num">${esc(e.tempo || '')}</td>
      <td class="num">${esc(e.rest || '')}</td>
    </tr>${e.note ? `<tr class="note"><td colspan="4">${esc(e.note)}</td></tr>` : ''}`;

  return `<div class="card">
    <div class="row">
      <strong>${esc(w.name)}</strong>
      <span class="unit">${esc(w.duration)} · ${esc(w.intensity)}</span>
    </div>
    <div class="macros">${esc(w.focus)}</div>
    ${deload ? `<div class="deload">Deload week — all weights down 40%, one less set per exercise. Mandatory, not optional.</div>` : ''}
    ${w.note ? `<p class="sub" style="margin:9px 0 0">${esc(w.note)}</p>` : ''}
    ${w.exercises?.length ? `<table class="ex">
      <thead><tr><th>Exercise</th><th class="num">Sets×Reps</th><th class="num">Tempo</th><th class="num">Rest</th></tr></thead>
      <tbody>${w.exercises.map(row).join('')}</tbody></table>` : ''}
    ${w.circuit ? `<div class="circuit"><strong>${esc(w.circuit.title)}</strong>
      <p class="sub" style="margin:3px 0 6px">${esc(w.circuit.note)}</p>
      <table class="ex"><tbody>${w.circuit.items.map(row).join('')}</tbody></table></div>` : ''}
    ${w.exercises?.length ? `<details class="rules"><summary>Training rules</summary><ul>${
      rules.map((r) => `<li>${esc(r)}</li>`).join('')}</ul></details>` : ''}
  </div>`;
}

/* --- today's plan ---------------------------------------------------------
 * Preference order:
 *   1. wt_meal_plan_entries rows for today, once the coach writes them
 *   2. a deterministic rotation over the recipe library
 * The rotation is seeded on the date, so the plan is stable all day and moves
 * on tomorrow, and each slot is drawn from the recipes closest to its protein
 * target so four meals add up to the day's number.
 * ------------------------------------------------------------------------ */

const SLOTS = [
  { key: 'breakfast', label: 'Breakfast', protein: 45 },
  { key: 'lunch',     label: 'Lunch',     protein: 45 },
  { key: 'dinner',    label: 'Dinner',    protein: 45 },
  { key: 'snack',     label: 'Snack',     protein: 25 },
];

/** Days since epoch in London — the rotation seed. */
function dayNumber() {
  return Math.floor(new Date(todayISO()).getTime() / 864e5);
}

async function allRecipes() {
  if (!RECIPES.length) {
    const rows = await tryRows('wt_recipes?select=*&order=title');
    RECIPES = rows || [];
  }
  return RECIPES;
}

/** Recipes a slot may draw on. Marinades and bare sides are never a meal. */
function poolFor(slot, recipes) {
  const usable = recipes.filter((r) =>
    r.calories_per_serving != null &&
    !(r.tags || []).includes('marinade') &&
    !(r.tags || []).includes('side'));

  let pool = usable.filter((r) => r.meal_type === slot.key);

  // Lunch and dinner are interchangeable when one of them is thin
  if (pool.length < 3 && (slot.key === 'lunch' || slot.key === 'dinner')) {
    pool = usable.filter((r) => r.meal_type === 'lunch' || r.meal_type === 'dinner');
  }
  if (!pool.length) pool = usable;

  // Closest to this slot's protein target first, then rotate within the best few
  return pool
    .slice()
    .sort((a, b) => Math.abs((a.protein_per_serving || 0) - slot.protein) -
                    Math.abs((b.protein_per_serving || 0) - slot.protein));
}

async function todaysPlan() {
  const recipes = await allRecipes();
  if (!recipes.length) return null;

  // 1. the coach's morning plan wins
  const byId = new Map(recipes.map((r) => [r.id, r]));
  const byTitle = new Map(recipes.map((r) => [r.title.toLowerCase(), r]));

  const coach = await tryRows(
    `wt_coach_daily_plan?select=slot,recipe_id,recipe_title,note,eaten,portion&date=eq.${todayISO()}`);
  if (coach && coach.length) {
    const plan = SLOTS.map((slot) => {
      const row = coach.find((e) => (e.slot || '').toLowerCase() === slot.key);
      if (!row) return { slot, recipe: null, source: 'coach' };
      // recipe_id is authoritative; fall back to the title the coach wrote
      const recipe = (row.recipe_id && byId.get(row.recipe_id)) ||
                     byTitle.get((row.recipe_title || '').toLowerCase()) ||
                     { id: `t-${slot.key}`, title: row.recipe_title, tags: [] };
      return { slot, recipe, source: 'coach', note: row.note,
               eaten: Boolean(row.eaten), portion: Number(row.portion) || 1 };
    });
    if (plan.some((p) => p.recipe)) return plan;
  }

  // 2. the Flutter app's own plan table, if it is ever populated
  const stored = await tryRows(
    `wt_meal_plan_entries?select=slot,recipe_id&date=eq.${todayISO()}`);
  if (stored && stored.length) {
    const plan = SLOTS.map((slot) => {
      const row = stored.find((e) => (e.slot || '').toLowerCase() === slot.key);
      return { slot, recipe: row ? byId.get(row.recipe_id) : null, source: 'planned' };
    });
    if (plan.some((p) => p.recipe)) return plan;
  }

  // 3. deterministic rotation — nothing saved yet today
  const seed = dayNumber();
  const used = new Set();
  return SLOTS.map((slot, i) => {
    const pool = poolFor(slot, recipes);
    const top = pool.slice(0, Math.max(3, Math.min(6, pool.length)));
    let pick = null;
    for (let k = 0; k < top.length; k++) {
      const cand = top[(seed + i * 2 + k) % top.length];
      if (!used.has(cand.id)) { pick = cand; break; }
    }
    pick = pick || top[(seed + i) % Math.max(top.length, 1)] || null;
    if (pick) used.add(pick.id);
    return { slot, recipe: pick, source: 'suggested' };
  });
}

/* --- one recipe renderer, used by Today, Plan and the batch list ---------- */

/** Marinades a recipe names in its ingredients, resolved to full recipes. */
function marinadesOf(recipe) {
  const byTitle = new Map(RECIPES.map((r) => [r.title.toLowerCase(), r]));
  const out = [];
  for (const ing of recipe.ingredients || []) {
    const m = /\(see ([^)]+)\)/i.exec(ing.item || '');
    if (!m) continue;
    const hit = byTitle.get(m[1].trim().toLowerCase());
    if (hit && !out.includes(hit)) out.push(hit);
  }
  return out;
}

const scaleQty = (q, portion) =>
  q == null ? '' : String(Math.round(q * portion * 100) / 100);

function ingredientList(recipe, portion = 1) {
  if (!(recipe.ingredients || []).length) return '';
  return `<strong>Ingredients${portion !== 1 ? ` (×${portion})` : ''}</strong><ul>${
    recipe.ingredients.map((g) => `<li>${esc(
      [scaleQty(g.quantity, portion), g.unit && g.unit !== 'whole' ? g.unit : '', g.item]
        .filter(Boolean).join(' '))}</li>`).join('')}</ul>`;
}

function methodList(recipe) {
  if (!(recipe.instructions || []).length) {
    return '<p class="empty">No method recorded for this one.</p>';
  }
  return `<strong style="display:block;margin-top:10px">Method</strong><ol>${
    recipe.instructions.map((x) => `<li>${esc(x.instruction || x)}</li>`).join('')}</ol>`;
}

/**
 * Full detail for a recipe: scaled ingredients, method, and any marinade it
 * depends on spelled out inline — those are repeat jobs and it is no use
 * knowing you need jerk marinade without being told how to make it.
 */
function recipeDetail(recipe, portion = 1) {
  const marinades = marinadesOf(recipe);
  return `
    ${ingredientList(recipe, portion)}
    ${methodList(recipe)}
    ${marinades.map((m) => `
      <details class="sub-recipe">
        <summary>${esc(m.title)} — how to make it</summary>
        ${ingredientList(m, 1)}
        ${methodList(m)}
        <p class="sub" style="margin:8px 0 0">Makes ${m.servings} tbsp. Keeps in a jar in the fridge,
          so make it once and use it across the week.</p>
      </details>`).join('')}`;
}

/* --- writes ---------------------------------------------------------------
 * The page holds only the anon key, so every write goes to the wt-action edge
 * function with Telegram's signed initData. Outside Telegram there is no
 * initData, so the buttons say so rather than failing silently.
 * ------------------------------------------------------------------------ */

const INIT_DATA = TG?.initData || '';
const CAN_WRITE = Boolean(INIT_DATA);

function toast(msg) {
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

async function act(payload) {
  if (!CAN_WRITE) {
    toast('Open this from the Telegram bot to make changes');
    return null;
  }
  try {
    const res = await fetch(`${CFG.url}/functions/v1/wt-action`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ...payload, initData: INIT_DATA }),
    });
    const body = await res.json();
    if (!res.ok || body.error) throw new Error(body.error || `HTTP ${res.status}`);
    return body;
  } catch (err) {
    toast(`Could not save: ${err.message}`);
    return null;
  }
}

/** Alternatives for a slot, worst-rated last, excluding what is already on today. */
async function swapOptions(slotKey, excludeIds) {
  const recipes = await allRecipes();
  const feedback = await tryRows('wt_recipe_feedback?select=recipe_id,verdict') || [];
  const verdicts = new Map(feedback.map((f) => [f.recipe_id, f.verdict]));
  const want = slotKey === 'snack' ? 25 : 45;

  let pool = recipes.filter((r) =>
    r.calories_per_serving != null &&
    !(r.tags || []).includes('marinade') &&
    !excludeIds.includes(r.id) &&
    (r.meal_type === slotKey ||
     (slotKey !== 'snack' && slotKey !== 'breakfast' &&
      (r.meal_type === 'lunch' || r.meal_type === 'dinner'))));
  if (!pool.length) pool = recipes.filter((r) => r.calories_per_serving != null && !excludeIds.includes(r.id));

  return pool.sort((a, b) => {
    const va = verdicts.get(a.id), vb = verdicts.get(b.id);
    const rank = (v) => (v === 'like' ? 0 : v === 'dislike' ? 2 : 1);
    if (rank(va) !== rank(vb)) return rank(va) - rank(vb);
    return Math.abs((a.protein_per_serving || 0) - want) - Math.abs((b.protein_per_serving || 0) - want);
  });
}

function openSwap(slot, currentIds, onPick) {
  const sheet = el('swap-sheet');
  el('swap-title').textContent = `Swap ${slot.label.toLowerCase()}`;
  el('swap-sub').textContent = 'Liked recipes first, disliked last';
  el('swap-options').innerHTML = '<p class="empty">Loading…</p>';
  sheet.hidden = false;

  swapOptions(slot.key, currentIds).then((opts) => {
    el('swap-options').innerHTML = opts.slice(0, 25).map((r) => `
      <button class="opt" data-id="${r.id}">
        <div>${esc(r.title)}</div>
        <div class="m">${r.calories_per_serving} kcal · ${r.protein_per_serving}g protein</div>
      </button>`).join('');
    el('swap-options').querySelectorAll('.opt').forEach((b) =>
      b.addEventListener('click', () => { sheet.hidden = true; onPick(b.dataset.id); }));
  });
}

el('swap-sheet').addEventListener('click', (e) => {
  if (e.target.id === 'swap-sheet') el('swap-sheet').hidden = true;
});


/** Wire Ate it / Swap / 👍 / 👎 on today's cards. */
function wireMealActions(plan) {
  const currentIds = plan.filter((p) => p.recipe?.id).map((p) => p.recipe.id);

  el('today-plan').querySelectorAll('.acts').forEach((bar) => {
    const slotKey = bar.dataset.slot;
    const recipeId = bar.dataset.recipe;
    const entry = plan.find((p) => p.slot.key === slotKey);
    if (!entry) return;

    bar.querySelector('.ate').addEventListener('click', async () => {
      const now = bar.querySelector('.ate').getAttribute('aria-pressed') === 'true';
      const res = await act({ action: now ? 'uneat' : 'eat', slot: slotKey });
      if (!res) return;
      TG?.HapticFeedback?.impactOccurred?.('medium');
      toast(now ? 'Unmarked' : `${entry.slot.label} logged`);
      renderToday();
    });

    bar.querySelector('.swap').addEventListener('click', () => {
      openSwap(entry.slot, currentIds, async (newId) => {
        const res = await act({ action: 'swap', slot: slotKey, recipeId: newId });
        if (!res) return;
        TG?.HapticFeedback?.notificationOccurred?.('success');
        toast(`Swapped to ${res.title}`);
        renderToday();
      });
    });

    bar.querySelectorAll('.rate').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!recipeId) return toast('No recipe record to rate');
        const verdict = btn.classList.contains('like') ? 'like' : 'dislike';
        const res = await act({ action: 'rate', recipeId, verdict });
        if (!res) return;
        TG?.HapticFeedback?.selectionChanged?.();
        toast(verdict === 'like' ? 'Noted — more of these' : 'Noted — fewer of these');
        renderToday();
      });
    });
  });
}

/* --- a plan for any date range ------------------------------------------ */

const addDays = (iso, n) => {
  const d = new Date(`${iso}T12:00:00Z`);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};
const weekdayOf = (iso) => new Date(`${iso}T12:00:00Z`).getUTCDay();
const DAY_META = [
  { day: 'Sunday', type: 'full rest', kcal: 1800, protein: 160 },
  { day: 'Monday', type: 'training', kcal: 2200, protein: 180 },
  { day: 'Tuesday', type: 'rest', kcal: 1900, protein: 170 },
  { day: 'Wednesday', type: 'training', kcal: 2200, protein: 180 },
  { day: 'Thursday', type: 'training', kcal: 2200, protein: 180 },
  { day: 'Friday', type: 'training', kcal: 2200, protein: 180 },
  { day: 'Saturday', type: 'rest', kcal: 1900, protein: 170 },
];

/**
 * Saved plan rows for a range, joined to recipes and grouped by date.
 * Returns [] when nothing is saved — the Plan tab says so rather than
 * inventing a fortnight the coach never agreed to.
 */
async function planRange(start, days) {
  const recipes = await allRecipes();
  const jars = await tryRows('wt_prepared_items?select=recipe_id,expires_on,remaining') || [];
  let prepTasksFor, stockFor;
  try {
    ({ prepTasksFor, stockFor } = await import('./batchplan.js'));
  } catch { /* badges are a nicety, not a requirement */ }
  const end = addDays(start, days - 1);
  const rows = await tryRows(
    `wt_coach_daily_plan?select=date,slot,recipe_id,recipe_title,portion,note` +
    `&date=gte.${start}&date=lte.${end}&order=date,slot`);
  if (!rows || !rows.length) return [];

  const byId = new Map(recipes.map((r) => [r.id, r]));
  const byTitle = new Map(recipes.map((r) => [r.title.toLowerCase(), r]));
  const order = { breakfast: 0, lunch: 1, dinner: 2, snack: 3 };
  const byDate = new Map();

  for (const row of rows) {
    const recipe = (row.recipe_id && byId.get(row.recipe_id)) ||
                   byTitle.get((row.recipe_title || '').toLowerCase()) || null;
    // Flag what needs doing before this meal can be made
    let prep = [];
    if (recipe && prepTasksFor) {
      const byTitleAll = new Map(recipes.map((r) => [r.title.toLowerCase(), r]));
      const inStock = new Set(
        jars.filter((j) => Number(j.remaining) > 0 && j.expires_on >= todayISO())
            .map((j) => j.recipe_id));
      prep = prepTasksFor(recipe, byTitleAll, inStock);
    }
    const entry = {
      slot: row.slot,
      title: row.recipe_title,
      portion: Number(row.portion) || 1,
      note: row.note,
      recipe,
      prep,
    };
    if (!byDate.has(row.date)) byDate.set(row.date, []);
    byDate.get(row.date).push(entry);
  }

  return [...byDate.entries()]
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([date, entries]) => {
      entries.sort((a, b) => (order[a.slot] ?? 9) - (order[b.slot] ?? 9));
      const meta = DAY_META[weekdayOf(date)];
      const kcal = entries.reduce((a, e) => a + (e.recipe?.calories_per_serving || 0) * e.portion, 0);
      const protein = entries.reduce((a, e) => a + (e.recipe?.protein_per_serving || 0) * e.portion, 0);
      return { date, meta, entries, kcal: Math.round(kcal), protein: Math.round(protein) };
    });
}

function dayLabel(iso) {
  const d = new Date(`${iso}T12:00:00Z`);
  const today = todayISO();
  if (iso === today) return 'Today';
  if (iso === addDays(today, 1)) return 'Tomorrow';
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
}

              ${Math.round(prot)}<span class="unit"> / ${d.protein}g P</span></span>
      </div></div>`;
    el('today-plan').querySelectorAll('.recipe').forEach((node) =>
      node.addEventListener('click', (e) => {
        if (e.target.closest('.acts')) return;   // buttons are not "expand"
        node.classList.toggle('open');
        TG?.HapticFeedback?.selectionChanged?.();
      }));

    wireMealActions(plan);
  }

  const energy = await tryRows('wt_energy_scores?select=date,score&order=date.desc&limit=7');
  const supps  = await tryRows('wt_supplement_logs?select=date,completed&order=date.desc&limit=14');
  el('today-streaks').innerHTML = [
    ['Energy today', energy?.[0]?.date === todayISO() ? `${energy[0].score}/5` : '—'],
    ['Supplements', supps ? `${supps.filter((s) => s.completed).length}/14 slots` : '—'],
    ['Plan week', week || '—'],
    ['Day type', d.type],
  ].map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('');
}

async function renderProgress() {
  const weights = await tryRows('wt_weigh_ins?select=date,weight_kg&order=date.asc&limit=60');
  if (weights === null) {
    el('progress-list').innerHTML =
      `<div class="err">Progress tables aren't readable yet. Run <code>20261024133000_add_coach_tracking_tables.sql</code>, and make sure this app can read them.</div>`;
    return;
  }

  const energy  = await tryRows('wt_energy_scores?select=date,score&order=date.asc&limit=60') || [];
  const planks  = await tryRows('wt_plank_logs?select=date,seconds&order=date.asc&limit=60') || [];
  const circuit = await tryRows('wt_circuit_logs?select=date,rounds&order=date.asc&limit=60') || [];

  const series = {
    weight:  weights.map((r) => Number(r.weight_kg)),
    energy:  energy.map((r) => r.score),
    plank:   planks.map((r) => r.seconds),
    circuit: circuit.map((r) => r.rounds),
  };

  const week = planWeek();
  const milestone = week <= 4 ? 'm1' : week <= 12 ? 'm3' : 'm6';
  const milestoneLabel = milestone === 'm1' ? 'Month 1' : milestone === 'm3' ? 'Month 3' : 'Month 6';
  el('progress-sub').textContent = `Next milestone: ${milestoneLabel} (week ${milestone === 'm1' ? 4 : milestone === 'm3' ? 12 : 24})`;

  el('progress-list').innerHTML = GLIDE.map((m) => {
    const vals = series[m.key] || [];
    const current = vals.length ? vals[vals.length - 1] : null;
    const target = m[milestone];
    const [cls, label] = current === null ? ['none', '⏸️ Insufficient data'] : statusFor(current, target, m.dir, vals.length);
    return `<div class="card">
      <div class="row">
        <strong>${m.label}</strong>
        <span class="status ${cls}">${label}</span>
      </div>
      <div class="row" style="margin-top:4px">
        <span class="big">${current ?? '—'}<span class="unit">${m.unit}</span></span>
        <span class="unit">target ${target}${m.unit}</span>
      </div>
      ${sparkline(vals)}
    </div>`;
  }).join('');
}

let RECIPES = [];
async function renderRecipes() {
  if (!RECIPES.length) {
    const rows = await tryRows('wt_recipes?select=*&order=title');
    if (rows === null) {
      el('recipe-list').innerHTML = `<div class="err">Couldn't load recipes.</div>`;
      return;
    }
    RECIPES = rows;
  }
  drawRecipes(el('recipe-search').value);
}

function drawRecipes(q = '') {
  const term = q.trim().toLowerCase();
  const list = RECIPES.filter((r) => !term ||
    [r.title, r.cuisine_type, r.meal_type, ...(r.tags || [])].join(' ').toLowerCase().includes(term));

  el('recipe-list').innerHTML = list.length ? list.map((r, i) => `
    <div class="card recipe" data-i="${i}">
      <div class="row">
        <h3>${esc(r.title)}</h3>
        <span class="unit">${r.calories_per_serving ?? '—'} kcal</span>
      </div>
      <div class="macros">
        ${r.protein_per_serving ?? '—'}g protein · ${r.carbs_per_serving ?? '—'}g carbs · ${r.fat_per_serving ?? '—'}g fat
        ${r.servings ? ` · serves ${r.servings}` : ''}
      </div>
      <div style="margin-top:7px">${(r.tags || []).slice(0, 3).map((t) => `<span class="pill">${esc(t)}</span>`).join('')}</div>
      <div class="detail">
        ${r.description ? `<p style="margin:0 0 8px">${esc(r.description)}</p>` : ''}
        ${recipeDetail(r, 1)}
      </div>
    </div>`).join('') : `<p class="empty">No recipes match “${esc(q)}”.</p>`;

  document.querySelectorAll('.recipe').forEach((node) => {
    node.addEventListener('click', () => {
      node.classList.toggle('open');
      TG?.HapticFeedback?.selectionChanged?.();
    });
  });
}

/** Ingredients for today's planned meals, grouped for the aisle. */
let shopDays = 1;

async function renderShopping() {
  let meals = [];

  if (shopDays === 1) {
    const plan = await todaysPlan();
    meals = (plan || []).filter((p) => p.recipe)
      .map((p) => ({ recipe: p.recipe, portion: 1, label: p.slot.label }));
    el('shopping-sub').textContent = meals.length
      ? `For today's ${meals.length} meals`
      : 'Nothing planned for today';
  } else {
    const days = await planRange(todayISO(), shopDays);
    meals = days.flatMap((d) => d.entries.filter((e) => e.recipe)
      .map((e) => ({ recipe: e.recipe, portion: e.portion, label: dayLabel(d.date) })));
    el('shopping-sub').textContent = days.length
      ? `For ${days.length} planned days — ${meals.length} meals`
      : `Nothing planned for the next ${shopDays} days`;
  }

  if (!meals.length) {
    el('shopping-list').innerHTML =
      `<p class="empty">No meals planned for this range. Ask Coach to plan the week.</p>`;
    return;
  }

  const GROUPS = {
    Proteins: /chicken|salmon|turkey|beef|prawn|tuna|egg|mackerel|mince|yoghurt|feta|cheese|milk|protein powder/i,
    Produce:  /pepper|onion|garlic|spinach|tomato|lemon|lime|plantain|avocado|herb|coriander|parsley|dill|thyme|chive|rocket|ginger|beetroot|blueberr|banana|broccoli|mushroom/i,
    Cupboard: /rice|oat|bread|bean|lentil|chickpea|flour|honey|oil|vinegar|soy|stock|mirin|seed|nut|salt|pepper|paprika|cumin|oregano|cinnamon|nutmeg|allspice|cayenne|curry|powder|puree|marinade|sofrito/i,
  };

  // Same ingredient across two meals is one line, with the portions added up
  // Same ingredient across meals becomes one line, quantities summed per unit
  // and scaled by the portion the plan calls for.
  // Recipes list quantities for the whole batch, so a 1000g/5-serving tray is
  // 200g for one plate. Everything is reduced to per-serving before scaling by
  // the portion the plan calls for.
  const SYNONYMS = [
    [/^(boneless |bone-in )?chicken thighs?.*/, 'chicken thighs'],
    [/^chicken breast.*/, 'chicken breast'],
    [/^(whole )?eggs?$/, 'eggs'],
    [/^feta( cheese)?$/, 'feta'],
    [/^(baby |fresh )?spinach$/, 'spinach'],
    [/^salmon fillets?$/, 'salmon fillets'],
    [/^(extra virgin )?olive oil$/, 'olive oil'],
    [/^greek yogh?urt.*/, 'Greek yoghurt (0% fat)'],
    [/^(red |white )?onions?$/, 'onion'],
    [/^garlic cloves?$/, 'garlic cloves'],
    [/^lemons?$/, 'lemon'],
    [/^red peppers?$/, 'red pepper'],
    [/^spring onions?$/, 'spring onion'],
  ];
  const canonical = (raw) => {
    const base = raw.toLowerCase().replace(/\s*\(.*?\)\s*/g, ' ').trim();
    for (const [re, to] of SYNONYMS) if (re.test(base)) return to;
    return base.replace(/s$/, '');
  };

  const items = new Map();
  for (const { recipe, portion, label } of meals) {
    const serves = recipe.servings || 1;
    for (const g of recipe.ingredients || []) {
      const name = (g.item || '').replace(/,.*$/, '').trim();
      if (!name) continue;
      const key = canonical(name);
      const group = Object.keys(GROUPS).find((k) => GROUPS[k].test(name)) || 'Other';
      const prev = items.get(key) || { name: key, group, units: new Map(), meals: new Set() };
      if (g.quantity) {
        // 'whole', 'large' and blank all mean "count of them"
        const raw = (g.unit || '').toLowerCase();
        const unit = ['whole', 'large', 'medium', 'piece', 'pieces'].includes(raw) ? '' : raw;
        const perServing = (g.quantity / serves) * portion;
        prev.units.set(unit, (prev.units.get(unit) || 0) + perServing);
      }
      prev.meals.add(label);
      items.set(key, prev);
    }
  }

  // Round sensibly: grams and ml to whole numbers, counts and spoons to a half
  const fmt = (n, unit) => {
    if (unit === 'g' || unit === 'ml') return String(Math.round(n));
    return String(Math.round(n * 2) / 2);
  };

  const saved = JSON.parse(localStorage.getItem(`wt-shopping-${todayISO()}-${shopDays}`) || '{}');
  const byGroup = {};
  for (const it of items.values()) (byGroup[it.group] ||= []).push(it);

  el('shopping-list').innerHTML = ['Proteins', 'Produce', 'Cupboard', 'Other']
    .filter((g) => byGroup[g]?.length)
    .map((g) => `<h2>${g}</h2><div class="card">${
      byGroup[g].sort((a, b) => a.name.localeCompare(b.name)).map((it) => {
        const id = 's-' + btoa(unescape(encodeURIComponent(it.name))).replace(/=/g, '');
        const qty = it.units.size
          ? ' — ' + [...it.units.entries()].map(([u, n]) => `${fmt(n, u)}${u ? ' ' + u : ''}`).join(' + ')
          : '';
        return `<label class="check${saved[id] ? ' done' : ''}">
          <input type="checkbox" id="${id}"${saved[id] ? ' checked' : ''}>
          <span>${esc(it.name)}<em class="qty">${esc(qty)}</em>
          <em class="for">${esc([...it.meals].slice(0, 4).join(', '))}${it.meals.size > 4 ? ` +${it.meals.size - 4}` : ''}</em></span></label>`;
      }).join('')
    }</div>`).join('');

  el('shopping-list').querySelectorAll('input[type=checkbox]').forEach((box) => {
    box.addEventListener('change', () => {
      box.closest('label').classList.toggle('done', box.checked);
      const key = `wt-shopping-${todayISO()}-${shopDays}`;
      const state = JSON.parse(localStorage.getItem(key) || '{}');
      state[box.id] = box.checked;
      localStorage.setItem(key, JSON.stringify(state));
      TG?.HapticFeedback?.impactOccurred?.('light');
    });
  });
}

async function renderScorecard() {
  const since = new Date(Date.now() - 6 * 864e5).toLocaleDateString('en-CA');
  const days   = await tryRows(`wt_daily_nutrition_summary?select=*&summary_date=gte.${since}&order=summary_date.asc`);
  const energy = await tryRows(`wt_energy_scores?select=date,score&date=gte.${since}`) || [];
  const batch  = await tryRows(`wt_batch_cook_logs?select=date,completed&date=gte.${since}`) || [];

  if (days === null) {
    el('scorecard').innerHTML = `<div class="err">Daily totals aren't readable yet.</div>`;
    return;
  }
  if (!days.length) {
    el('scorecard').innerHTML = `<p class="empty">No logged days yet this week. The coach fills this in as you log meals.</p>`;
    return;
  }

  const hit = days.filter((d) => (d.total_protein_g || 0) >= 160).length;
  const avgKcal = Math.round(days.reduce((a, d) => a + (d.total_calories || 0), 0) / days.length);
  const avgProt = Math.round(days.reduce((a, d) => a + (d.total_protein_g || 0), 0) / days.length);
  const avgEnergy = energy.length ? (energy.reduce((a, e) => a + e.score, 0) / energy.length).toFixed(1) : '—';

  el('scorecard').innerHTML = `<div class="grid">
    ${[['Protein target hit', `${hit}/${days.length}`],
       ['Avg calories', `${avgKcal}`],
       ['Avg protein', `${avgProt}g`],
       ['Avg energy', avgEnergy],
       ['Batch cooks', `${batch.filter((b) => b.completed).length}/2`],
       ['Days logged', `${days.length}/7`]]
      .map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}
  </div>
  ${sparkline(days.map((d) => d.total_protein_g || 0))}
  <p class="sub" style="margin-top:6px">Daily protein, last ${days.length} days</p>`;
}

/* --- shell ---------------------------------------------------------------- */

const VIEWS = {
  today: renderToday,
  plan: renderPlan,
  recipes: renderRecipes,
  shopping: renderShopping,
  progress: async () => { await renderScorecard(); await renderProgress(); },
};

function show(name) {
  for (const key of Object.keys(VIEWS)) el(`view-${key}`).hidden = key !== name;
  document.querySelectorAll('nav button').forEach((b) =>
    b.setAttribute('aria-current', String(b.dataset.view === name)));
  VIEWS[name]();
}

document.querySelectorAll('nav button').forEach((b) =>
  b.addEventListener('click', () => { show(b.dataset.view); TG?.HapticFeedback?.selectionChanged?.(); }));

el('recipe-search').addEventListener('input', (e) => drawRecipes(e.target.value));

function wireSegment(id, onPick) {
  el(id).addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    el(id).querySelectorAll('button').forEach((b) =>
      b.setAttribute('aria-pressed', String(b === btn)));
    TG?.HapticFeedback?.selectionChanged?.();
    onPick(Number(btn.dataset.days));
  });
}
wireSegment('plan-range', (d) => { planDays = d; renderPlan(); });
wireSegment('shop-range', (d) => { shopDays = d; renderShopping(); });

/* Telegram theme — fall back to the CSS defaults outside Telegram */
function applyTheme() {
  const p = TG?.themeParams;
  if (!p) return;
  const map = {
    '--bg': p.bg_color, '--text': p.text_color, '--hint': p.hint_color,
    '--link': p.link_color, '--button': p.button_color,
    '--button-text': p.button_text_color, '--secondary-bg': p.secondary_bg_color,
  };
  for (const [k, v] of Object.entries(map)) if (v) document.documentElement.style.setProperty(k, v);
}

if (TG) { TG.ready(); TG.expand?.(); applyTheme(); TG.onEvent?.('themeChanged', applyTheme); }

if (!CFG.url || !CFG.anonKey) {
  document.querySelector('main').innerHTML =
    `<h1>Not configured</h1><div class="err">Copy <code>config.example.js</code> to <code>config.js</code> and fill in your Supabase URL and anon key.</div>`;
} else {
  show('today');
}
